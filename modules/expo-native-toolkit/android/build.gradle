apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.nativetoolkit'
version = '0.1.0'

android {
  namespace "expo.modules.nativetoolkit"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // Nullability annotations (@NonNull, @Nullable) for cleaner Kotlin <-> Java boundaries.
  implementation 'androidx.annotation:annotation:1.7.1'
  // kotlinx-coroutines-android is on the classpath transitively via expo-modules-core,
  // so we don't redeclare it here (avoids duplicate-class warnings on aggregate builds).

  // [2026-05-21 ExpoFaceLandmarkerModule] AR face tracking for status filters.
  // ML Kit Face Detection ships the model bundled in the AAR — no Play Services
  // model download required at runtime, which matters for first-launch UX.
  // CameraX is the lightest path to a buffered front-camera stream (expo-camera
  // would require a UI host; face tracking only needs the pixel buffer).
  implementation 'com.google.mlkit:face-detection:16.1.5'
  implementation 'androidx.camera:camera-core:1.3.4'
  implementation 'androidx.camera:camera-camera2:1.3.4'
  implementation 'androidx.camera:camera-lifecycle:1.3.4'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
