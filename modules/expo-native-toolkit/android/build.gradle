apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.nativetoolkit'
version = '0.1.0'

android {
  namespace "expo.modules.nativetoolkit"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
    // [2026-10-09 android-ml-parity] ChatyyMlTranslatorImpl is loaded by
    // reflection from ExpoNativeChatSecurityModule → keep it through R8.
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // [2026-10-09 android-ml-parity] On-device translation (ML Kit Translate)
  // is OPT-IN: its engine is a bundled native lib (+16 MB arm64 / +11.6 MB
  // armv7 uncompressed, ~6.8 MB compressed download per ABI). Enable with
  // CHATYY_MLKIT_TRANSLATE=1 (env) or -PchatyyMlkitTranslate=true.
  if (chatyyMlkitTranslateEnabled()) {
    sourceSets {
      main.java.srcDirs += 'src/mlkitTranslate/java'
    }
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // Nullability annotations (@NonNull, @Nullable) for cleaner Kotlin <-> Java boundaries.
  implementation 'androidx.annotation:annotation:1.7.1'
  // [2026-10-07 native-docs-mail] NativePdfView (PdfRenderer pages in a RecyclerView).
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  // kotlinx-coroutines-android is on the classpath transitively via expo-modules-core,
  // so we don't redeclare it here (avoids duplicate-class warnings on aggregate builds).

  // [2026-05-21 ExpoFaceLandmarkerModule] AR face tracking for status filters.
  // ML Kit Face Detection ships the model bundled in the AAR — no Play Services
  // model download required at runtime, which matters for first-launch UX.
  // CameraX is the lightest path to a buffered front-camera stream (expo-camera
  // would require a UI host; face tracking only needs the pixel buffer).
  implementation 'com.google.mlkit:face-detection:16.1.5'
  implementation 'androidx.camera:camera-core:1.3.4'
  implementation 'androidx.camera:camera-camera2:1.3.4'
  implementation 'androidx.camera:camera-lifecycle:1.3.4'

  // [2026-10-07 native-maps] MapLibre Native (OSM vector tiles from our self-hosted
  // BoraUm tileserver). ZERO Google/Play Services. 13.0.2 = last line built against
  // kotlin-stdlib 2.0.x (13.1+ pulls stdlib 2.2.x; RN 0.83 compiles with Kotlin 2.1.20).
  implementation 'org.maplibre.gl:android-sdk:13.0.2'

  // [2026-10-08 android-otp-shortcuts] SMS User Consent API (ExpoSmsOtpModule).
  // Already in the app graph transitively (play-services-auth via
  // expo-chat-backup / firebase auth); declared explicitly so this module
  // compiles on its own. Pinned to the version already in the graph (no bump).
  implementation 'com.google.android.gms:play-services-auth-api-phone:18.0.2'

  // [2026-10-08 sticker-maker] ExpoStickerCutoutModule — recorte do objeto
  // (subject segmentation) p/ o criador de figurinhas. Modelo NÃO vai no APK:
  // o Play services baixa sob demanda (ModuleInstall). ModuleInstall vem do
  // play-services-base (já no grafo).
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

  // [2026-10-09 android-ml-parity] ExpoNativeChatSecurityModule (Android half
  // of the iOS module: OCR / language ID / translation / transcription).
  // UNBUNDLED Play services variants: the models are downloaded on demand by
  // Play services (ModuleInstall), the APK only gets the thin client
  // (~0.5 MB of classes). Versions aligned with what's already in the graph
  // (mlkit common 18.11.0 / play-services-base 18.5.0 via barcode-scanning).
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  implementation 'com.google.android.gms:play-services-mlkit-language-id:17.0.0'
  if (chatyyMlkitTranslateEnabled()) {
    implementation 'com.google.mlkit:translate:17.0.3'
  }
}

def chatyyMlkitTranslateEnabled() {
  def env = (System.getenv('CHATYY_MLKIT_TRANSLATE') ?: '').trim().toLowerCase()
  if (env == '1' || env == 'true' || env == 'on') return true
  def prop = rootProject.findProperty('chatyyMlkitTranslate')
  return prop != null && prop.toString().trim().toLowerCase() == 'true'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
