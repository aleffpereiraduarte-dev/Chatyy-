apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyyattach'
version = '1.0.0'

android {
  namespace "expo.modules.chatyyattach"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  // [2026-10-15 native-attach] Todas JÁ no grafo do app (zero bytes novos):
  //   CameraX 1.5.1 = mesma versão do expo-camera (vision-camera pede
  //   1.5.0-alpha03 → Gradle resolve 1.5.1 para todos);
  //   Glide 5.0.5 = expo-image; dynamicanimation 1.1.0 = já transitiva.
  def camerax_version = "1.5.1"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-video:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
