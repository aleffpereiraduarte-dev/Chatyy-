apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.shorts'
version = '0.1.0'

android {
  namespace "expo.modules.shorts"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'

  // [Stage 1 scaffold, 2026-05-16] AndroidX Media3 (ExoPlayer successor).
  // Declared at Stage 1 so CI proves the deps resolve before we wire real
  // playback in Stage 2. ShortsPlayerView.kt does NOT reference these
  // classes yet — they will be imported when the real PlayerView lands.
  //
  //   media3-exoplayer        — ExoPlayer core (player, source, renderers)
  //   media3-ui               — PlayerView (styled SurfaceView + controls)
  //   media3-exoplayer-hls    — HLS DataSource + extractor (Shorts ingest
  //                              transcodes to HLS for adaptive bitrate)
  //
  // 1.3.1 matches the latest stable on Maven Central as of 2026-05-16 and
  // requires minSdk 21 (we're at 24, fine) + compileSdk 34+ (we're at 35).
  implementation 'androidx.media3:media3-exoplayer:1.3.1'
  implementation 'androidx.media3:media3-ui:1.3.1'
  implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
