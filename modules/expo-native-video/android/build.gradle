apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.nativevideo'
version = '0.1.0'

android {
  namespace "expo.modules.nativevideo"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // MediaCodec, MediaMuxer, MediaExtractor, MediaMetadataRetriever are all
  // part of android.media (built into the platform since API 18/16). No
  // external deps required — this module is intentionally zero-cost on APK
  // size beyond the small Kotlin class itself.
  implementation 'androidx.core:core-ktx:1.13.1'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
