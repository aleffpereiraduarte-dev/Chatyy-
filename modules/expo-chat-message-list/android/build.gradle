apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyymessagelist'
version = '1.0.0'

android {
  namespace "expo.modules.chatyymessagelist"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // [2026-10-14 native-list] Mesmas versões que o binário já carrega
  // (expo-media-viewer / expo-image): zero bytes novos de terceiros.
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  // [native-ctxmenu] SpringAnimation do menu de contexto — já no binário
  // (react-native-keyboard-controller puxa dynamicanimation 1.x).
  implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
