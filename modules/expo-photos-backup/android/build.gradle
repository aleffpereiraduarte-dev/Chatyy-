apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.photosbackup'
version = '1.0.0'

// [2026-10-15 photos-native] Backup de fotos/vídeos nativo (WorkManager +
// MediaStore + OkHttp streaming). Contrato: modules/expo-photos-backup/index.ts.
android {
  namespace "expo.modules.photosbackup"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // Mesmas versões que modules/expo-background-upload já puxa: zero bytes novos.
  implementation 'androidx.work:work-runtime-ktx:2.9.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
