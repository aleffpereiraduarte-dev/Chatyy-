apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyyconversationlist'
version = '1.0.0'

android {
  namespace "expo.modules.chatyyconversationlist"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // [2026-10-14 native-home] AndroidX (Google Maven), já no grafo do app —
  // mesmas versões do expo-media-viewer: zero dependência de terceiros nova.
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  // Mesma versão que o binário já carrega (expo-image → Glide 5.0.5).
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  // [2026-10-15 native-lists] Puxar p/ atualizar (já no grafo do app via RN).
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
