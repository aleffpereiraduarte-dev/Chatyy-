apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyymediaeditor'
version = '1.0.0'

android {
  namespace "expo.modules.chatyymediaeditor"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // [2026-10-15 native-editor] Só plataforma Android (Canvas/ColorMatrix,
  // VideoView, MediaMetadataRetriever, MediaExtractor+MediaMuxer) + core-ktx
  // (PathParser/WindowInsets), que o binário já carrega. Zero dependência nova.
  implementation 'androidx.core:core-ktx:1.13.1'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
