apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyyprofile'
version = '1.0.0'

android {
  namespace "expo.modules.chatyyprofile"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // [2026-10-15 native-profile] Só o que o binário já carrega: AndroidX core +
  // Glide 5.0.5 (expo-image) p/ avatares e miniaturas.
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  // Galeria de fotos do perfil (pager). Mesmas versões do expo-media-viewer — já no APK.
  implementation 'androidx.viewpager2:viewpager2:1.0.0'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
