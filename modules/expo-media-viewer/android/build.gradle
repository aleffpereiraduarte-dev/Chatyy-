apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyymediaviewer'
version = '1.0.0'

android {
  namespace "expo.modules.chatyymediaviewer"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // [2026-10-14 native-viewer] Pager nativo. AndroidX (Google Maven), já no
  // grafo via material/viewpager2 — sem dependência de terceiros nova.
  implementation 'androidx.viewpager2:viewpager2:1.0.0'
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  // Mesmas versões que o binário já carrega (expo-image → Glide 5.0.5;
  // expo-video → Media3 1.8.0): zero bytes novos no APK.
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  implementation 'androidx.media3:media3-exoplayer:1.8.0'
  implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
  implementation 'androidx.media3:media3-common:1.8.0'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
