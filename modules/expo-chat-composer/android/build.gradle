apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyycomposer'
version = '1.0.0'

android {
  namespace "expo.modules.chatyycomposer"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // [2026-10-14 native-composer] Só AndroidX core (já no grafo) — ViewCompat
  // OnReceiveContentListener / InputConnectionCompat (colar imagem / GIF do
  // teclado) e WindowInsetsAnimationCompat (teclado frame a frame).
  implementation 'androidx.core:core-ktx:1.13.1'
  // Miniatura da barra de resposta: mesma versão que o binário já carrega
  // (expo-image → Glide 5.0.5; também usada pelo expo-media-viewer).
  implementation 'com.github.bumptech.glide:glide:5.0.5'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
