apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.callkit'
version = '0.1.0'

android {
  namespace "expo.modules.callkit"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  // [2026-05-15] androidx.collection.LruCache used by CallNotificationService
  // for the avatar bitmap cache. Pulled transitively by core-ktx but
  // declared explicitly to make the dep visible and pin behavior.
  implementation 'androidx.collection:collection:1.4.0'
  // [2026-05-16 Day 2 native call screen] lifecycleScope + repeatOnLifecycle.
  // CallActivity launches the LiveKit connect coroutine inside lifecycleScope
  // so it auto-cancels when the activity finishes — preventing zombie Rooms
  // after a back-stack pop.
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
  implementation platform('com.google.firebase:firebase-bom:33.7.0')
  implementation 'com.google.firebase:firebase-messaging'

  // [2026-05-16 Day 2 — full native call] LiveKit Android SDK. Bundles libwebrtc
  // m144 transitively (~15-25MB across ABIs). API surface used by CallActivity:
  //   - LiveKit.create(applicationContext)         → factory
  //   - room.connect(url, token)                   → suspend
  //   - room.events.collect { event -> when (event) is RoomEvent.X -> ... }
  //   - room.initVideoRenderer(view)               → register a renderer
  //   - VideoTrack.addRenderer(view)               → bind a remote track
  //   - localParticipant.setMicrophoneEnabled(true) → suspend
  //   - localParticipant.setCameraEnabled(true)    → suspend
  //   - room.disconnect()                          → suspend
  // 2.24.x and 2.22.x have the same public API for these; pinning 2.24.1.
  // Sources validated: livekit/client-sdk-android/sample-app-basic MainActivity.kt.
  implementation 'io.livekit:livekit-android:2.24.1'

  // [2026-05-16 Stage 4] Explicit OkHttp for RelayWakeService's raw
  // WebSocket connection. okhttp is pulled transitively by livekit-android
  // today, but declaring it explicitly pins the version and prevents
  // breakage if LiveKit is ever swapped out for another SFU.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  // [2026-05-16 Stage 2 Android screenshare wiring] expo-callkit publishes the
  // active LK Room into expo-screen-share's LiveKitRoomHolder so the
  // foreground MediaProjection service can hand frames to the local
  // participant. Direction is callkit -> screenshare (NOT the reverse —
  // screenshare would create a cycle if it ever called back into callkit).
  implementation project(':expo-screen-share')
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
