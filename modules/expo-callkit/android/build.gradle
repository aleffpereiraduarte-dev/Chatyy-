// [2026-05-18] Kotlin 2.0+ requires the standalone Compose Compiler Gradle
// plugin when `buildFeatures { compose true }` is set. The plugin is NOT on
// the root project's buildscript classpath by default (Expo's autolinking
// only injects KGP + AGP), so `apply plugin:` alone fails with
//   "Plugin with id 'org.jetbrains.kotlin.plugin.compose' not found."
// We add the classpath dependency here, in the module's own buildscript,
// so the legacy `apply plugin:` syntax can resolve it. Version is pinned
// to the project-wide Kotlin version so the compiler plugin matches the
// Kotlin compiler — a mismatch causes
//   "This version (X) of the Compose Compiler requires Kotlin version Y".
buildscript {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  dependencies {
    def kver = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.0.21'
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${kver}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.callkit'
version = '0.1.0'

android {
  namespace "expo.modules.callkit"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // [2026-05-17 Stage #994] Enable Jetpack Compose for the full-native call
  // UI in CallActivity / GroupCallActivity. Compose lets us build the rich
  // /call.js replacement (animated pulse rings, active-speaker breathing
  // ring, floating reactions, glassmorphism gradient) without dragging in
  // dozens of view-system custom Drawables.
  buildFeatures {
    compose true
  }
  composeOptions {
    // Kotlin 2.0+ uses the bundled compose-compiler-gradle-plugin; expo
    // already sets kotlinVersion ~2.0.21 so the BOM picks a matching
    // compiler under the hood. We still set this explicitly so the
    // Compose Compiler plugin (KGP < 2.0 fallback) finds a known-good
    // version if needed.
    kotlinCompilerExtensionVersion "1.5.15"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.appcompat:appcompat:1.7.0'
  // [2026-05-15] androidx.collection.LruCache used by CallNotificationService
  // for the avatar bitmap cache. Pulled transitively by core-ktx but
  // declared explicitly to make the dep visible and pin behavior.
  implementation 'androidx.collection:collection:1.4.0'
  // [2026-05-16 Day 2 native call screen] lifecycleScope + repeatOnLifecycle.
  // CallActivity launches the LiveKit connect coroutine inside lifecycleScope
  // so it auto-cancels when the activity finishes — preventing zombie Rooms
  // after a back-stack pop.
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
  implementation platform('com.google.firebase:firebase-bom:33.7.0')
  implementation 'com.google.firebase:firebase-messaging'

  // [2026-05-16 Day 2 — full native call] LiveKit Android SDK. Bundles libwebrtc
  // m144 transitively (~15-25MB across ABIs). API surface used by CallActivity:
  //   - LiveKit.create(applicationContext)         → factory
  //   - room.connect(url, token)                   → suspend
  //   - room.events.collect { event -> when (event) is RoomEvent.X -> ... }
  //   - room.initVideoRenderer(view)               → register a renderer
  //   - VideoTrack.addRenderer(view)               → bind a remote track
  //   - localParticipant.setMicrophoneEnabled(true) → suspend
  //   - localParticipant.setCameraEnabled(true)    → suspend
  //   - room.disconnect()                          → suspend
  // 2.24.x and 2.22.x have the same public API for these; pinning 2.24.1.
  // Sources validated: livekit/client-sdk-android/sample-app-basic MainActivity.kt.
  implementation 'io.livekit:livekit-android:2.24.1'

  // [2026-05-16 Stage 4] Explicit OkHttp for RelayWakeService's raw
  // WebSocket connection. okhttp is pulled transitively by livekit-android
  // today, but declaring it explicitly pins the version and prevents
  // breakage if LiveKit is ever swapped out for another SFU.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  // [2026-05-16 Stage 2 Android screenshare wiring] expo-callkit publishes the
  // active LK Room into expo-screen-share's LiveKitRoomHolder so the
  // foreground MediaProjection service can hand frames to the local
  // participant. Direction is callkit -> screenshare (NOT the reverse —
  // screenshare would create a cycle if it ever called back into callkit).
  implementation project(':expo-screen-share')

  // [2026-05-18] RNNoise dep removed — `com.github.livekit:rnnoise-android`
  // 0.1.0 is published only via JitPack and that artifact now returns 401
  // (the underlying tag was either deleted or auth-gated). RNNoiseProcessor
  // already loads `org.xiph.rnnoise.RNNoise` via reflection — when the class
  // isn't on the classpath it degrades to identity (no noise suppression).
  // Behavior is functionally equivalent to the binary failing to load on a
  // user's device, which we already handle. WhatsApp/Telegram pattern uses
  // Android's built-in `android.media.audiofx.NoiseSuppressor` AudioEffect
  // anyway — switching to that is the right long-term move (see TaskCreate).

  // [2026-05-17 MediaPipe background blur / virtual background] Google
  // MediaPipe Tasks Vision (Apache 2). Provides SelfieSegmentation that we
  // wrap in expo.modules.callkit.video.BackgroundProcessor. The .tflite
  // model itself lives under src/main/assets/mediapipe/ (see the manual
  // setup notes in MEMORY) and is fetched at first use via
  // ImageSegmenter.createFromOptions(...). Reflection-loaded too so a build
  // without the asset still ships, just with the toggles disabled.
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'

  // [2026-05-17 Stage #994] Jetpack Compose stack for CallActivity /
  // GroupCallActivity Compose UI rewrite. BOM 2024.09.03 pins the
  // ui/material3/foundation/animation matrix to a single tested set so
  // we don't have to manage individual artifact versions. activity-compose
  // gives us setContent {} on ComponentActivity (the base class both
  // activities already extend). material-icons-extended is heavy (~5MB)
  // but pulls every Filled icon we need (Mic, MicOff, CameraAlt, etc.)
  // — much smaller than embedding 20 vector drawables.
  implementation platform('androidx.compose:compose-bom:2024.09.03')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.animation:animation'
  implementation 'androidx.compose.runtime:runtime'
  implementation 'androidx.activity:activity-compose:1.9.2'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
  implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
