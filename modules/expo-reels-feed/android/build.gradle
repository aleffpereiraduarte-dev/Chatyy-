apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.chatyyreelsfeed'
version = '1.0.0'

android {
  namespace "expo.modules.chatyyreelsfeed"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // [2026-10-15 native-reels] Tudo já está no binário (zero bytes novos):
  //   recyclerview 1.3.2 (expo-media-viewer / expo-chat-message-list),
  //   swiperefreshlayout 1.1.0 (react-android expõe como `api`),
  //   Glide 5.0.5 (expo-image), Media3 1.8.0 (expo-video / expo-media-viewer).
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
  implementation 'com.github.bumptech.glide:glide:5.0.5'
  implementation 'androidx.media3:media3-exoplayer:1.8.0'
  implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
  implementation 'androidx.media3:media3-common:1.8.0'
  implementation 'androidx.media3:media3-datasource:1.8.0'
  implementation 'androidx.media3:media3-database:1.8.0'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
