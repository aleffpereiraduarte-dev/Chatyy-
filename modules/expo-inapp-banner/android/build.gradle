apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.inappbanner'
version = '1.0.0'

// [2026-10-16 native-toast] Banner de notificação dentro do app (Android).
// Contrato: modules/expo-inapp-banner/index.ts.
android {
  namespace "expo.modules.inappbanner"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.core:core-ktx:1.13.1'
  // Mesma versão que expo-image/expo-media-viewer já carregam: zero bytes novos.
  implementation 'com.github.bumptech.glide:glide:5.0.5'
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
