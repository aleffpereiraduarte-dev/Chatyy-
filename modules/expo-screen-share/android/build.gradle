apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.screenshare'
version = '1.0.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.screenshare"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation project(':expo-modules-core')

  // [2026-05-16 Android screenshare] Same LK version as expo-callkit so the
  // shared transitive libwebrtc (m144) stays consistent — mixing versions
  // crashes at runtime with UnsatisfiedLinkError on the JNI bridge.
  implementation 'io.livekit:livekit-android:2.24.1'

  // ContextCompat.startForegroundService + NotificationCompat builder.
  implementation 'androidx.core:core-ktx:1.13.1'

  // lifecycleScope for coroutine launches inside the module.
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

  // [Bridge #1 2026-05-19] In-process broadcast bus used by
  // ScreenShareService.stopSelfClean → ExpoScreenShareModule.bridgeReceiver
  // so the "Stop sharing" system bar press surfaces an onBroadcastStopped
  // event in JS (otherwise the "Sharing…" UI button stays stuck forever).
  implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
