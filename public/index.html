<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- [2026-10-11 visual polish] Paint the app background BEFORE the JS bundle
         boots, so cold loads in dark mode don't flash a white page for ~1s.
         Mirrors context/ThemeContext.js: theme_mode (light|dark|system) wins,
         legacy theme_dark next, else the OS preference. Colors = theme.js
         background (#ffffff / #000000). -->
    <style id="chatyy-boot-bg">
      html, body { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
      html.chatyy-boot-dark, html.chatyy-boot-dark body { background: #000000; }
      html.chatyy-boot-light, html.chatyy-boot-light body { background: #ffffff; }
    </style>
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme_mode');
          var legacy = localStorage.getItem('theme_dark');
          var dark = null;
          if (m === 'dark') dark = true;
          else if (m === 'light') dark = false;
          else if (m !== 'system' && legacy !== null) dark = legacy === 'true' || legacy === '1';
          if (dark !== null) document.documentElement.className += dark ? ' chatyy-boot-dark' : ' chatyy-boot-light';
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
