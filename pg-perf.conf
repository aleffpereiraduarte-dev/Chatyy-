# PostgreSQL performance tuning for Chatyy (32GB RAM, 8 cores, SSD)
# Applied 2026-04-10

# WAL tuning — reduce fsync overhead for chat workloads
synchronous_commit = off          # ~5x write throughput; 1-2 commits lost on crash (acceptable for chat)
wal_buffers = 64MB                # Was default 16MB
wal_writer_delay = 200ms          # Batch WAL writes (default 200ms, explicit)
max_wal_size = 2GB                # Was 1GB; reduce checkpoint frequency
checkpoint_completion_target = 0.9

# Memory tuning
effective_io_concurrency = 200     # SSD: high parallelism
random_page_cost = 1.1             # SSD: random reads nearly as fast as sequential
huge_pages = try                   # Use huge pages if available (reduces TLB misses)

# Query planning
default_statistics_target = 200    # Better planner estimates (default 100)
jit = on                           # JIT compilation for complex queries

# Connection handling (pgbouncer handles pooling, so PG connections are few)
idle_in_transaction_session_timeout = 30000  # Kill idle-in-transaction after 30s

# Logging for slow query detection
log_min_duration_statement = 100   # Log queries taking >100ms
log_checkpoints = on
log_lock_waits = on
