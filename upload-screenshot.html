<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Screenshots - Chatyy</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #0f0f1a; color: #fff; }
h1 { font-size: 24px; }
.upload-area { border: 2px dashed #4f46e5; border-radius: 16px; padding: 40px; text-align: center; margin: 20px 0; cursor: pointer; }
.upload-area:hover { border-color: #818cf8; background: rgba(79,70,229,0.1); }
input[type=file] { display: none; }
.previews { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
.previews img { width: 100%; border-radius: 12px; border: 1px solid #333; }
.btn { background: #4f46e5; color: #fff; border: none; padding: 14px 28px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; margin: 10px 0; }
.btn:disabled { opacity: 0.5; }
.status { padding: 10px; border-radius: 8px; margin: 10px 0; }
.ok { background: #065f46; }
.err { background: #7f1d1d; }
.info { color: #9ca3af; font-size: 14px; margin: 10px 0; }
.count { color: #818cf8; font-size: 18px; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>
<h1>Upload Screenshots</h1>
<p class="info">Seleciona quantas fotos quiser.</p>

<div class="upload-area" onclick="document.getElementById('file').click()">
<p>Toca aqui pra selecionar fotos</p>
<p style="font-size:13px;color:#666">Pode selecionar varias de uma vez</p>
<input type="file" id="file" accept="image/*" multiple onchange="preview(this)">
</div>

<div id="count" class="count"></div>
<div id="previews" class="previews"></div>
<div id="status"></div>

<button class="btn" id="uploadBtn" onclick="upload()" disabled>Enviar</button>

<script>
let selectedFiles = [];

function preview(input) {
  if (!input.files || !input.files.length) return;
  selectedFiles = Array.from(input.files);
  document.getElementById('count').textContent = selectedFiles.length + ' foto(s)';
  const c = document.getElementById('previews');
  c.innerHTML = '';
  selectedFiles.forEach(f => {
    const r = new FileReader();
    r.onload = e => { const img = document.createElement('img'); img.src = e.target.result; c.appendChild(img); };
    r.readAsDataURL(f);
  });
  document.getElementById('uploadBtn').disabled = false;
}

async function upload() {
  if (!selectedFiles.length) return;
  const btn = document.getElementById('uploadBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerHTML = '';
  let ok = 0, fail = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    btn.textContent = 'Enviando ' + (i+1) + '/' + selectedFiles.length;
    const fd = new FormData();
    fd.append('screenshot', selectedFiles[i]);
    fd.append('index', i);
    fd.append('key', 'chatyy2026admin');
    try {
      const r = await fetch('/api/upload-ss.php', { method: 'POST', body: fd });
      const d = await r.json();
      if (d.success) ok++; else fail++;
    } catch(e) { fail++; }
  }

  status.innerHTML = '';
  if (ok > 0) status.innerHTML += '<div class="status ok">' + ok + ' enviada(s)!</div>';
  if (fail > 0) status.innerHTML += '<div class="status err">' + fail + ' falhou</div>';
  btn.textContent = ok > 0 ? 'Enviado!' : 'Tentar de novo';
  if (fail > 0) btn.disabled = false;
}
</script>
</body>
</html>
