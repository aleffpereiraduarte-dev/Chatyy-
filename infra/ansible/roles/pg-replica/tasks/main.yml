# roles/pg-replica/tasks/main.yml
#
# Sets up a read-only PostgreSQL streaming replica of origin's chatyy_main.
# Target lag: <1s. PoP code (chatyy-ws-cpp, chat.php replicated worker) hits
# this replica for auth / membership reads — writes still go to origin
# master via WG.
#
# Origin prep (run ONCE on 217.216.67.99 before any PoP is added):
#
#   sudo -u postgres psql <<'SQL'
#     CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'CHANGEME_LONG_RANDOM';
#     SELECT pg_create_physical_replication_slot('pop_frankfurt');
#     SELECT pg_create_physical_replication_slot('pop_ashburn');
#     SELECT pg_create_physical_replication_slot('pop_saopaulo');
#   SQL
#
#   # postgresql.conf
#   wal_level = replica
#   max_wal_senders = 10
#   max_replication_slots = 10
#   wal_keep_size = 1024            # MB
#   hot_standby = on
#
#   # pg_hba.conf — only over WG
#   host replication replicator 10.88.0.0/24 scram-sha-256

- name: Add PGDG apt repo key
  apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PGDG apt repo
  apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PG client + server (must match origin major version)
  apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - postgresql-contrib-16
    state: present
    update_cache: yes

- name: Pin PG data dir variable
  set_fact:
    pg_data: /var/lib/postgresql/16/main
    pg_conf_dir: /etc/postgresql/16/main

- name: Stop PG before basebackup if data dir is empty/fresh
  systemd:
    name: postgresql
    state: stopped
  changed_when: false

- name: Detect if replica is already initialised
  stat:
    path: "{{ pg_data }}/standby.signal"
  register: pg_standby_marker

# ---------------------------------------------------------------------------
# Take basebackup from origin (only once). Re-running is safe — we skip if
# the standby.signal marker exists.
# ---------------------------------------------------------------------------

- name: Wipe stale data dir before basebackup
  file:
    path: "{{ pg_data }}"
    state: absent
  when: not pg_standby_marker.stat.exists

- name: Recreate empty data dir owned by postgres
  file:
    path: "{{ pg_data }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when: not pg_standby_marker.stat.exists

- name: Run pg_basebackup from origin (this is the slow step ~3–6 min on first run)
  become: yes
  become_user: postgres
  environment:
    PGPASSWORD: "{{ pg_replica_password | default(lookup('env','PG_REPLICA_PASSWORD')) }}"
  command: >
    /usr/lib/postgresql/16/bin/pg_basebackup
      -h {{ pg_origin_host }}
      -p 5432
      -U {{ pg_replica_user }}
      -D {{ pg_data }}
      -Fp -Xs -P -R
      -S pop_{{ inventory_hostname | replace('pop-','') }}
  when: not pg_standby_marker.stat.exists
  register: basebackup_out

- name: Pin replica config (postgresql.auto.conf appended by -R)
  blockinfile:
    path: "{{ pg_data }}/postgresql.auto.conf"
    create: yes
    owner: postgres
    group: postgres
    marker: "# {mark} CHATYY POP REPLICA OVERRIDES"
    block: |
      hot_standby = on
      hot_standby_feedback = on
      max_standby_streaming_delay = 30s
      primary_slot_name = 'pop_{{ inventory_hostname | replace('pop-','') }}'

- name: Ensure listen_addresses includes WG IP only (no public exposure)
  lineinfile:
    path: "{{ pg_conf_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost,{{ wg_ip }}'"
    backup: yes
  notify: restart postgresql

- name: pg_hba — allow local read users + WG-only replication echo
  blockinfile:
    path: "{{ pg_conf_dir }}/pg_hba.conf"
    marker: "# {mark} CHATYY POP HBA"
    block: |
      host    all             all             127.0.0.1/32            scram-sha-256
      host    all             all             {{ wg_subnet }}         scram-sha-256
  notify: restart postgresql

- name: UFW allow PG only from WG mesh
  community.general.ufw:
    rule: allow
    port: "5432"
    proto: tcp
    src: "{{ wg_subnet }}"

- name: Enable + start postgresql
  systemd:
    name: postgresql
    enabled: yes
    state: started

# ---------------------------------------------------------------------------
# Lag check — fail loud if replica isn't catching up after 60s.
# ---------------------------------------------------------------------------

- name: Wait for replica to catch up (<10s lag)
  shell: |
    sudo -u postgres psql -tAc \
      "SELECT COALESCE(EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())), 0)::int"
  register: lag_check
  until: lag_check.stdout | int < 10
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
