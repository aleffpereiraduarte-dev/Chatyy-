%% Distribuição Erlang com TLS 1.3 mútuo (CA interna do roteador).
[{server, [{certfile, "/etc/chatyy-router/tls/node.pem"},
           {keyfile, "/etc/chatyy-router/tls/node.key"},
           {cacertfile, "/etc/chatyy-router/tls/ca.pem"},
           {verify, verify_peer},
           {fail_if_no_peer_cert, true},
           {versions, ['tlsv1.3']}]},
 {client, [{certfile, "/etc/chatyy-router/tls/node.pem"},
           {keyfile, "/etc/chatyy-router/tls/node.key"},
           {cacertfile, "/etc/chatyy-router/tls/ca.pem"},
           {verify, verify_peer},
           {versions, ['tlsv1.3']}]}].
