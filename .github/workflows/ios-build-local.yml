name: iOS Build (local, GitHub macOS runner)

# Builds an iOS .ipa locally on a GitHub macOS runner. Bypasses EAS cloud
# credentials by using credentialsSource: "local" with files restored from
# GitHub Secrets at runtime.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # Magic trigger file — touch this to fire an iOS build via plain git push.
  push:
    paths:
      - '.github/triggers/ios-build.txt'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Sanity check — required secrets
        run: |
          missing=()
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing+=("EXPO_TOKEN")
          [ -z "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" ] && missing+=("IOS_DIST_CERT_P12_BASE64")
          [ -z "${{ secrets.IOS_DIST_CERT_PASSWORD }}" ] && missing+=("IOS_DIST_CERT_PASSWORD")
          [ -z "${{ secrets.IOS_PROFILE_MAIN_BASE64 }}" ] && missing+=("IOS_PROFILE_MAIN_BASE64")
          [ -z "${{ secrets.IOS_PROFILE_SHAREEXT_BASE64 }}" ] && missing+=("IOS_PROFILE_SHAREEXT_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi
          echo "All required secrets are set."

      - uses: actions/checkout@v4

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli whoami

      - name: Restore signing credentials from secrets
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          MAIN_B64: ${{ secrets.IOS_PROFILE_MAIN_BASE64 }}
          SHAREEXT_B64: ${{ secrets.IOS_PROFILE_SHAREEXT_BASE64 }}
        run: |
          mkdir -p credentials
          echo "$P12_B64" | base64 -d > credentials/apple-dist.p12
          echo "$MAIN_B64" | base64 -d > credentials/chatyy-main.mobileprovision
          echo "$SHAREEXT_B64" | base64 -d > credentials/chatyy-shareext.mobileprovision

          cat > credentials.json <<EOF
          {
            "ios": {
              "Chatyy": {
                "provisioningProfilePath": "credentials/chatyy-main.mobileprovision",
                "distributionCertificate": {
                  "path": "credentials/apple-dist.p12",
                  "password": "${P12_PASS}"
                }
              },
              "ShareExtension": {
                "provisioningProfilePath": "credentials/chatyy-shareext.mobileprovision",
                "distributionCertificate": {
                  "path": "credentials/apple-dist.p12",
                  "password": "${P12_PASS}"
                }
              }
            }
          }
          EOF

          # Pre-install profiles so xcodebuild can locate them by UUID.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp credentials/chatyy-main.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/480ef27d-fe7a-4986-af2e-57c75bf3e0d7.mobileprovision
          cp credentials/chatyy-shareext.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/d302e18b-f58a-43b8-8b1f-9bf4b2d05194.mobileprovision

          ls -la credentials/

      - name: Build iOS .ipa locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
        run: |
          set -o pipefail
          npx eas-cli build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output ./build.ipa 2>&1 | tee /tmp/eas-build.log

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ./failure-logs
          cp /tmp/eas-build.log ./failure-logs/eas-build.log 2>/dev/null || true
          # EAS local build temp dir lives under /private/var/folders or /tmp
          find /tmp /private/var/folders -name "eas-build-local-*" -type d 2>/dev/null | while read d; do
            echo "=== $d ==="
            ls -la "$d" 2>&1
            find "$d" -name "*.log" -exec cp {} ./failure-logs/ \; 2>/dev/null || true
          done
          tail -200 /tmp/eas-build.log 2>&1 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-failure-logs-${{ github.run_number }}
          path: ./failure-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Submit to TestFlight
        if: ${{ inputs.submit == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit \
            --platform ios \
            --profile production \
            --path ./build.ipa \
            --non-interactive

      - name: Upload .ipa as artifact
        if: ${{ inputs.submit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chatyy-ios-${{ github.run_number }}
          path: ./build.ipa
          retention-days: 7

      - name: Wipe credentials
        if: always()
        run: |
          rm -rf credentials credentials.json || true

      - name: Report build time + cost estimate
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          # macos-latest: $0.16/min on private repos.
          cost_cents=$(( (elapsed * 16 + 59) / 60 ))
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars} (private repo, macos-latest @ \$0.16/min)"
