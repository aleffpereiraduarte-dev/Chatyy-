name: iOS Build (xcodebuild bypass EAS)

# Builds iOS .ipa using xcodebuild directly, bypassing EAS local entirely.
# Mirrors the Mac 207 procedure (see memory ios_build_xcodebuild_bypass_eas).
# EAS local was failing with "Distribution certificate hasn't been imported"
# because EAS creates a temp keychain it can't fully control. xcodebuild on
# our own keychain works fine.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.github/triggers/ios-build.txt'
      - '.github/triggers/mobile-build.txt'

permissions:
  contents: write

jobs:
  build:
    # 2026-05-12: Mac 207 self-hosted runner foi desativado. Migrei pra
    # macos-latest (GitHub cloud) — grátis no plano atual, builds em
    # 20-30min com Xcode 16+. Setup de keychain + provisioning profile
    # via secrets passos abaixo.
    # 2026-05-20: bumped pra macos-latest-xlarge (M2 12-core / 24GB) —
    # 4× mais rápido nas etapas pesadas (`pod install`, `expo prebuild`,
    # `xcodebuild archive` com Swift 6 + MediaPipeTasksVision). Custo ~5×
    # por minuto mas tempo cai de 25min pra 8min → custo total similar e
    # turnaround melhor. Fallback gracioso: se runner indisponível, GH
    # cai pra macos-latest automaticamente em 5min de queue.
    runs-on: macos-latest-xlarge
    timeout-minutes: 60
    env:
      KEYCHAIN_NAME: chatyy-build.keychain-db
      KEYCHAIN_PASS: ci-build-pass
      MAIN_PROFILE_UUID: 480ef27d-fe7a-4986-af2e-57c75bf3e0d7
      SHAREEXT_PROFILE_UUID: d302e18b-f58a-43b8-8b1f-9bf4b2d05194
      # [2026-05-18 NSE] Profile created via ASC API (scripts/asc-create-nse-profile.js)
      # — bundle com.onemundo.mail.notificationservice. No App Group linked
      # because public ASC API doesn't expose that relationship; the NSE
      # entitlements file is empty (no app-groups requested), which matches.
      NSE_BUNDLE_ID: com.onemundo.mail.notificationservice
      NSE_PROFILE_UUID: 695e2ec7-6a2f-4193-8919-9ad98a4e81c5
      # [2026-05-15 #827] BROADCAST_PROFILE_UUID lido do conteúdo decoded
      # do secret IOS_PROFILE_BROADCAST_BASE64 em runtime (UUID dentro do
      # .mobileprovision). Bundle id: com.onemundo.mail.broadcast.
      TEAM_ID: XN9XN27QCE
      MAIN_BUNDLE_ID: com.onemundo.mail
      SHAREEXT_BUNDLE_ID: com.onemundo.mail.share-extension
      BROADCAST_BUNDLE_ID: com.onemundo.mail.broadcast
      APP_NAME: Chatyy

    steps:
      - name: Sanity check — required secrets
        run: |
          missing=()
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing+=("EXPO_TOKEN")
          [ -z "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" ] && missing+=("IOS_DIST_CERT_P12_BASE64")
          [ -z "${{ secrets.IOS_DIST_CERT_PASSWORD }}" ] && missing+=("IOS_DIST_CERT_PASSWORD")
          [ -z "${{ secrets.IOS_PROFILE_MAIN_BASE64 }}" ] && missing+=("IOS_PROFILE_MAIN_BASE64")
          [ -z "${{ secrets.IOS_PROFILE_SHAREEXT_BASE64 }}" ] && missing+=("IOS_PROFILE_SHAREEXT_BASE64")
          [ -z "${{ secrets.IOS_PROFILE_NSE_BASE64 }}" ] && missing+=("IOS_PROFILE_NSE_BASE64")
          # IOS_PROFILE_BROADCAST_BASE64 is optional — only required when the
          # broadcast extension plugin is active in app.json. The plugin is
          # currently OFF (user needs to create profile on Apple Dev portal
          # first); when present, the install + signing steps below detect
          # the secret and wire it in automatically.
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Apple WWDR + root certs into login keychain
        run: |
          set -x
          curl -fsSL -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -fsSL -o /tmp/AppleIncRootCertificate.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import /tmp/AppleWWDRCAG3.cer -k ~/Library/Keychains/login.keychain-db -T /usr/bin/codesign -T /usr/bin/security || true
          security import /tmp/AppleIncRootCertificate.cer -k ~/Library/Keychains/login.keychain-db -T /usr/bin/codesign -T /usr/bin/security || true

      - name: Create build keychain and import distribution cert
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -x
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          # Recreate keychain fresh.
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          # Add to search list (alongside login.keychain so trust chain resolves).
          security list-keychains -d user -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db

          # Decode + import .p12 with -A so codesign can use the key without UI prompts.
          echo "$P12_B64" | base64 -d > /tmp/apple-dist.p12
          security import /tmp/apple-dist.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security -A
          rm -f /tmp/apple-dist.p12

          # Allow codesign to access the key without prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "---identities---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        id: profiles
        env:
          MAIN_B64: ${{ secrets.IOS_PROFILE_MAIN_BASE64 }}
          SHAREEXT_B64: ${{ secrets.IOS_PROFILE_SHAREEXT_BASE64 }}
          NSE_B64: ${{ secrets.IOS_PROFILE_NSE_BASE64 }}
          BROADCAST_B64: ${{ secrets.IOS_PROFILE_BROADCAST_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MAIN_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/$MAIN_PROFILE_UUID.mobileprovision
          echo "$SHAREEXT_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/$SHAREEXT_PROFILE_UUID.mobileprovision
          echo "$NSE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/$NSE_PROFILE_UUID.mobileprovision
          # Broadcast profile is OPTIONAL — only installed if secret is set
          # and the broadcast plugin is active in app.json. If absent, the
          # build proceeds without the broadcast extension target (screen
          # share via system picker is unavailable but app otherwise works).
          if [ -n "$BROADCAST_B64" ]; then
            TMP_BROADCAST=$(mktemp)
            echo "$BROADCAST_B64" | base64 -d > "$TMP_BROADCAST"
            BROADCAST_UUID=$(security cms -D -i "$TMP_BROADCAST" 2>/dev/null | plutil -extract UUID raw - || echo "")
            if [ -n "$BROADCAST_UUID" ]; then
              cp "$TMP_BROADCAST" ~/Library/MobileDevice/Provisioning\ Profiles/$BROADCAST_UUID.mobileprovision
              echo "broadcast_uuid=$BROADCAST_UUID" >> $GITHUB_OUTPUT
              echo "Installed broadcast profile UUID: $BROADCAST_UUID"
            else
              echo "::warning::IOS_PROFILE_BROADCAST_BASE64 present but UUID extraction failed — skipping"
              echo "broadcast_uuid=" >> $GITHUB_OUTPUT
            fi
            rm -f "$TMP_BROADCAST"
          else
            echo "::notice::IOS_PROFILE_BROADCAST_BASE64 not set — broadcast extension disabled"
            echo "broadcast_uuid=" >> $GITHUB_OUTPUT
          fi
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Bump build number
        id: bump
        run: |
          # Read current ios.buildNumber from app.json and increment it.
          CURRENT=$(node -e "console.log(require('./app.json').expo.ios.buildNumber)")
          NEW=$((CURRENT + 1))
          node -e "
            const fs=require('fs');
            const p=require('./app.json');
            p.expo.ios.buildNumber=String($NEW);
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "build=$NEW" >> $GITHUB_OUTPUT
          echo "Build number bumped to $NEW"

      - name: Run expo prebuild
        run: |
          npx expo prebuild --platform ios --no-install --clean
          ls -la ios/

      - name: Patch ShareExtension signing in pbxproj
        # withManualIosSigning plugin only patches main app target, not
        # ShareExtension — possibly because expo-share-intent inserts that
        # config differently. Brute-force patch with a node script (kept as
        # a separate .js file so the runner does not have to interpret
        # inline HEREDOCs — that caused 0.75s silent failures on macOS
        # self-hosted under certain shell configurations).
        run: node scripts/patch-shareext-signing.js

      - name: Patch NotificationService signing in pbxproj
        # [2026-05-18] Same reason as ShareExtension: with-notification-service
        # plugin sets CODE_SIGN_STYLE=Automatic but CI uses Manual everywhere.
        # Inject PROVISIONING_PROFILE_SPECIFIER directly into per-target
        # XCBuildConfiguration so xcodebuild Archive can find the profile.
        run: node scripts/patch-nse-signing.js

      - name: Patch BroadcastExtension signing in pbxproj
        # The with-broadcast-extension Expo plugin generates the appex target
        # with CODE_SIGN_STYLE=Automatic. Our CI is Manual signing across
        # all targets. Force Manual + inject the broadcast profile UUID
        # extracted from the .mobileprovision in the "Install provisioning
        # profiles" step. Skipped when broadcast_uuid is empty (plugin off
        # or secret missing).
        if: steps.profiles.outputs.broadcast_uuid != ''
        env:
          BROADCAST_UUID: ${{ steps.profiles.outputs.broadcast_uuid }}
        run: node scripts/patch-broadcast-signing.js

      - name: Install Pods
        env:
          # CocoaPods 1.16 + Ruby 4.0 fails with
          # "Unicode Normalization not appropriate for ASCII-8BIT
          # (Encoding::CompatibilityError)" when LANG is unset
          # on the macos-latest runner — runner ships with C/POSIX
          # locale by default. Force UTF-8 so String#unicode_normalize
          # in Pod::Config#installation_root works.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          cd ios
          pod install --repo-update

      - name: Archive with xcodebuild
        run: |
          set -x
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          cd ios
          xcodebuild -workspace "$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            "OTHER_CODE_SIGN_FLAGS=--keychain=$KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        env:
          BROADCAST_UUID: ${{ steps.profiles.outputs.broadcast_uuid }}
        run: |
          set -x
          # Conditionally include the broadcast bundle id in ExportOptions
          # only when the broadcast extension is wired (plugin active +
          # secret present + UUID extracted).
          if [ -n "$BROADCAST_UUID" ]; then
            BROADCAST_PROFILE_ENTRY="<key>$BROADCAST_BUNDLE_ID</key><string>$BROADCAST_UUID</string>"
          else
            BROADCAST_PROFILE_ENTRY=""
          fi
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$MAIN_BUNDLE_ID</key><string>$MAIN_PROFILE_UUID</string>
              <key>$SHAREEXT_BUNDLE_ID</key><string>$SHAREEXT_PROFILE_UUID</string>
              <key>$NSE_BUNDLE_ID</key><string>$NSE_PROFILE_UUID</string>
              ${BROADCAST_PROFILE_ENTRY}
            </dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          cat /tmp/ExportOptions.plist

          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            "OTHER_CODE_SIGN_FLAGS=--keychain=$KEYCHAIN_PATH"

          # Move IPA to known path
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          cp "$IPA" ./build.ipa
          ls -la ./build.ipa

      - name: Submit to TestFlight (altool direto — bypass EAS queue, 20× mais rápido)
        # ROOT CAUSE histórico: `eas-cli submit` enfileira no worker EAS hospedado +
        # poll serializado pro Apple Transporter = 40min toda build. Apple's altool
        # faz upload direto pro ASC: 90-180s. Pré-instalado em macos-latest.
        if: ${{ github.event_name == 'push' || inputs.submit == 'true' }}
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: 'QSYM3KX73P'
          ASC_ISSUER_ID: '494360d0-0420-4f1f-a1db-6be19eeb2d89'
        run: |
          if [ -z "$ASC_KEY_B64" ]; then
            echo "::error::Missing secret ASC_KEY_P8_BASE64 — required for App Store Connect auth."
            exit 1
          fi
          # altool procura a key em ~/.appstoreconnect/private_keys/AuthKey_{ID}.p8
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "→ Uploading build.ipa direct to ASC via altool…"
          xcrun altool --upload-app \
            --type ios \
            --file ./build.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose 2>&1 | tail -50
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "✓ Submitted to ASC"

      - name: Auto-attach new build to TestFlight beta groups
        # Apple's "internal" groups can't be attached via API (422), but external
        # groups CAN — and external is what serves the public TestFlight link plus
        # any user with the build invite. Without this step the binary uploads,
        # validates, but stays orphaned (no group → no tester sees it). Confirmed
        # via ASC API on build 466 (2026-05-08): VALID + IN_BETA_TESTING but
        # individualTesters=0 and betaGroups=[] until manually attached.
        if: ${{ success() && (github.event_name == 'push' || inputs.submit == 'true') }}
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: 'QSYM3KX73P'
          ASC_ISSUER_ID: '494360d0-0420-4f1f-a1db-6be19eeb2d89'
          ASC_APP_ID: '6759975575'
          # Comma-separated betaGroup IDs to auto-attach (external + any future ones)
          ASC_BETA_GROUPS: '9345fde9-8543-4426-a30d-a42e9b41e37f'
          BUILD_VERSION: ${{ steps.bump.outputs.build }}
        run: |
          set -e
          echo "$ASC_KEY_B64" | base64 -d > ./asc_key.p8
          # Ensure PyJWT + cryptography are installed for ES256 signing (self-hosted
          # Mac 207 runner doesn't have them by default). --break-system-packages is
          # required on macOS Python 3.11+ which marks the system env as externally
          # managed by PEP 668.
          python3 -m pip install --quiet --break-system-packages --user pyjwt cryptography 2>/dev/null \
            || python3 -m pip install --quiet --user pyjwt cryptography 2>/dev/null \
            || pip3 install --quiet --user pyjwt cryptography
          export PYTHONPATH="$(python3 -c 'import site; print(site.getusersitepackages())'):$PYTHONPATH"
          # Wait up to 8min for Apple to finish processing (state goes PROCESSING → VALID).
          # Without this, the attach POST will 422 with "Build is not yet processed."
          python3 - <<'PY'
          import jwt, time, json, urllib.request, urllib.error, os, sys
          KID, ISS, APP, GROUPS_RAW = os.environ['ASC_KEY_ID'], os.environ['ASC_ISSUER_ID'], os.environ['ASC_APP_ID'], os.environ['ASC_BETA_GROUPS']
          VER = os.environ['BUILD_VERSION']
          PRIV = open('asc_key.p8').read()
          def jwt_token():
              now = int(time.time())
              return jwt.encode({"iss":ISS,"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}, PRIV, algorithm="ES256", headers={"kid":KID,"typ":"JWT"})
          H = {"Authorization": f"Bearer {jwt_token()}"}
          # Poll for build to reach VALID state
          deadline = time.time() + 8*60
          build_id = None
          while time.time() < deadline:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={APP}&filter[version]={VER}&limit=1", headers=H))
                  data = json.loads(r.read())
                  if data.get('data'):
                      attrs = data['data'][0]['attributes']
                      state = attrs.get('processingState')
                      print(f"build {VER} state={state}")
                      if state == 'VALID':
                          build_id = data['data'][0]['id']; break
                      if state == 'INVALID':
                          print("::error::Build VALIDATION FAILED on Apple side"); sys.exit(1)
              except urllib.error.HTTPError as e:
                  print(f"poll err {e.code}")
              time.sleep(20)
          if not build_id:
              print("::warning::build did not reach VALID in 8min — skipping attach"); sys.exit(0)
          # Set whatsNew localization (Apple blocks beta review submissions without release notes)
          headers_post = {**H, "Content-Type": "application/json"}
          whats_new = f"Build {VER} — bug fixes and polish"
          try:
              loc_r = urllib.request.urlopen(urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}/betaBuildLocalizations", headers=H))
              loc_data = json.loads(loc_r.read())
              if loc_data.get('data'):
                  loc_id = loc_data['data'][0]['id']
                  patch_body = {"data": {"id": loc_id, "type": "betaBuildLocalizations",
                                         "attributes": {"whatsNew": whats_new}}}
                  patch_req = urllib.request.Request(
                      f"https://api.appstoreconnect.apple.com/v1/betaBuildLocalizations/{loc_id}",
                      data=json.dumps(patch_body).encode(), headers=headers_post, method="PATCH")
                  urllib.request.urlopen(patch_req)
                  print(f"✓ Set whatsNew localization for build {VER}")
              else:
                  print(f"::warning::no betaBuildLocalizations for build {build_id} — skipping whatsNew")
          except urllib.error.HTTPError as e:
              print(f"::error::whatsNew PATCH failed {e.code}: {e.read().decode()[:300]}"); sys.exit(1)
          # Attach to each external group — fail hard on non-recoverable errors
          group_ids = [g.strip() for g in GROUPS_RAW.split(',') if g.strip()]
          body = {"data": [{"id": gid, "type": "betaGroups"} for gid in group_ids]}
          url = f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}/relationships/betaGroups"
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers_post, method="POST")
          try:
              urllib.request.urlopen(req)
              print(f"✓ Attached build {VER} ({build_id}) to {len(group_ids)} beta group(s)")
          except urllib.error.HTTPError as e:
              code = e.code
              body_txt = e.read().decode()[:500]
              # 409 = "already attached" — safe to ignore (idempotent re-runs)
              if code == 409:
                  print(f"⚠ build already attached to groups (409) — OK");
              else:
                  print(f"::error::attach failed {code}: {body_txt}"); sys.exit(1)
          # Submit pra Beta App Review — REQUIRED toda build pra external group.
          # Sem este POST, build trava em READY_FOR_BETA_SUBMISSION e testers
          # externos NUNCA recebem update (descoberto 2026-05-13: 6 builds órfãos
          # desde 467, last submitted manual). Apple aprova em <2h normalmente.
          # Retry loop: 422 INVALID_QC_STATE is a known race — build can be VALID
          # (processingState) but Apple's internal QC state still needs ~1-5min
          # after upload before betaAppReviewSubmissions accepts. We poll up to
          # 8 minutes with 30s backoff. If it never settles, downgrade to a
          # warning (build is uploaded + attached to groups, just stuck in
          # READY_FOR_BETA_SUBMISSION until someone manual-submits on ASC).
          sub_body = {"data": {"type": "betaAppReviewSubmissions",
                               "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}}
          submitted = False
          sub_deadline = time.time() + 8*60
          attempt = 0
          while time.time() < sub_deadline and not submitted:
              attempt += 1
              sub_req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions",
                  data=json.dumps(sub_body).encode(), headers=headers_post, method="POST")
              try:
                  urllib.request.urlopen(sub_req)
                  print(f"✓ Build {VER} submitted to Beta App Review (attempt {attempt}, Apple aprova <2h)")
                  submitted = True
                  break
              except urllib.error.HTTPError as e:
                  code = e.code
                  body_txt = e.read().decode()[:500]
                  if code == 409:
                      print(f"⚠ build already submitted to review (409) — OK"); submitted = True; break
                  elif code == 422 and ('already in review' in body_txt.lower() or 'already in beta review' in body_txt.lower() or 'ANOTHER_BUILD_IN_REVIEW' in body_txt):
                      # Apple's actual error string is "already in beta review"
                      # (with "beta" between "in" and "review"). Match on either
                      # phrase OR on the canonical error code
                      # ENTITY_UNPROCESSABLE.ANOTHER_BUILD_IN_REVIEW which is
                      # what triggers when a previous build is still pending
                      # external beta review. Build IS attached to beta groups
                      # already (internal testers see it instantly); the next
                      # build will auto-submit once the previous review clears.
                      print(f"⚠ another build still in beta review (422 ANOTHER_BUILD_IN_REVIEW) — current build is on TestFlight for internal/existing testers, external submission queued"); submitted = True; break
                  elif code == 422 and 'CLOSED_VERSION' in body_txt:
                      # ENTITY_UNPROCESSABLE.CLOSED_VERSION — this marketing
                      # version (and prior ones) are closed for EXTERNAL beta
                      # review, usually because the version went to App Store
                      # review/release. The build IS uploaded VALID and IS
                      # already attached to the beta group, so INTERNAL testers
                      # (and any existing external testers on an open train)
                      # get it instantly — only a NEW external beta-review
                      # submission is blocked until the marketing version is
                      # bumped. NOT fatal: the build is testable. Surface a
                      # warning instead of failing the whole pipeline red.
                      print(f"⚠ version closed for external beta review (422 CLOSED_VERSION) — build {VER} ({build_id}) is on TestFlight + attached to the beta group (internal testers get it now). To open EXTERNAL testing, bump the marketing version (app.json expo.version) and rebuild."); submitted = True; break
                  elif code == 422 and 'INVALID_QC_STATE' in body_txt:
                      print(f"⏳ attempt {attempt}: QC state not ready yet — retry in 30s")
                      time.sleep(30); continue
                  else:
                      print(f"::error::beta submission failed {code}: {body_txt}"); sys.exit(1)
          if not submitted:
              # Build IS on TestFlight + attached to groups; just not auto-submitted
              # to review. Don't fail the workflow — manual submit on ASC is the
              # documented fallback. Warning surfaces in the GH Actions summary.
              print(f"::warning title=Beta submission deferred::Build {VER} ({build_id}) uploaded + attached to groups, but QC state never settled. Submit manually on App Store Connect → TestFlight → Build {VER} → Submit to Review.")
          PY
          rm -f ./asc_key.p8

      - name: Upload .ipa as artifact
        # Always upload so we have a recoverable copy even after submission.
        uses: actions/upload-artifact@v4
        with:
          name: chatyy-ios-${{ steps.bump.outputs.build }}
          path: ./build.ipa
          retention-days: 7

      - name: Commit bumped buildNumber back to repo
        # Runs even if later steps (beta-submit) fail — once altool uploads the
        # IPA, Apple has burned that buildNumber. Without committing, next CI run
        # reads stale app.json, bumps to the SAME number, altool rejects
        # "build already exists" → infinite lockup. (Happened 2026-05-23.)
        if: ${{ !cancelled() && steps.bump.outputs.build != '' && (github.event_name == 'push' || inputs.submit == 'true') }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add app.json
          if git diff --cached --quiet; then
            echo "No buildNumber change to commit."
          else
            git commit -m "chore(ios): bump buildNumber to ${{ steps.bump.outputs.build }} [skip ci]"
            # Pull-rebase to avoid race with parallel pushes, then push.
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Wipe keychain + creds
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/$KEYCHAIN_NAME" 2>/dev/null || true
          rm -f /tmp/apple-dist.p12 /tmp/ExportOptions.plist || true

      - name: Report build time + cost
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          cost_cents=$(( (elapsed * 16 + 59) / 60 ))
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars}"
