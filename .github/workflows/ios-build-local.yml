name: iOS Build (xcodebuild bypass EAS)

# Builds iOS .ipa using xcodebuild directly, bypassing EAS local entirely.
# Mirrors the Mac 207 procedure (see memory ios_build_xcodebuild_bypass_eas).
# EAS local was failing with "Distribution certificate hasn't been imported"
# because EAS creates a temp keychain it can't fully control. xcodebuild on
# our own keychain works fine.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.github/triggers/ios-build.txt'
      - '.github/triggers/mobile-build.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      KEYCHAIN_NAME: chatyy-build.keychain-db
      KEYCHAIN_PASS: ci-build-pass
      MAIN_PROFILE_UUID: 480ef27d-fe7a-4986-af2e-57c75bf3e0d7
      SHAREEXT_PROFILE_UUID: d302e18b-f58a-43b8-8b1f-9bf4b2d05194
      TEAM_ID: XN9XN27QCE
      MAIN_BUNDLE_ID: com.onemundo.mail
      SHAREEXT_BUNDLE_ID: com.onemundo.mail.share-extension
      APP_NAME: Chatyy

    steps:
      - name: Sanity check — required secrets
        run: |
          missing=()
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing+=("EXPO_TOKEN")
          [ -z "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" ] && missing+=("IOS_DIST_CERT_P12_BASE64")
          [ -z "${{ secrets.IOS_DIST_CERT_PASSWORD }}" ] && missing+=("IOS_DIST_CERT_PASSWORD")
          [ -z "${{ secrets.IOS_PROFILE_MAIN_BASE64 }}" ] && missing+=("IOS_PROFILE_MAIN_BASE64")
          [ -z "${{ secrets.IOS_PROFILE_SHAREEXT_BASE64 }}" ] && missing+=("IOS_PROFILE_SHAREEXT_BASE64")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Apple WWDR + root certs into login keychain
        run: |
          set -x
          curl -fsSL -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -fsSL -o /tmp/AppleIncRootCertificate.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          security import /tmp/AppleWWDRCAG3.cer -k ~/Library/Keychains/login.keychain-db -T /usr/bin/codesign -T /usr/bin/security || true
          security import /tmp/AppleIncRootCertificate.cer -k ~/Library/Keychains/login.keychain-db -T /usr/bin/codesign -T /usr/bin/security || true

      - name: Create build keychain and import distribution cert
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -x
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          # Recreate keychain fresh.
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          # Add to search list (alongside login.keychain so trust chain resolves).
          security list-keychains -d user -s "$KEYCHAIN_PATH" ~/Library/Keychains/login.keychain-db

          # Decode + import .p12 with -A so codesign can use the key without UI prompts.
          echo "$P12_B64" | base64 -d > /tmp/apple-dist.p12
          security import /tmp/apple-dist.p12 -k "$KEYCHAIN_PATH" -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security -A
          rm -f /tmp/apple-dist.p12

          # Allow codesign to access the key without prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          echo "---identities---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          MAIN_B64: ${{ secrets.IOS_PROFILE_MAIN_BASE64 }}
          SHAREEXT_B64: ${{ secrets.IOS_PROFILE_SHAREEXT_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MAIN_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/$MAIN_PROFILE_UUID.mobileprovision
          echo "$SHAREEXT_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/$SHAREEXT_PROFILE_UUID.mobileprovision
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Bump build number
        id: bump
        run: |
          # Read current ios.buildNumber from app.json and increment it.
          CURRENT=$(node -e "console.log(require('./app.json').expo.ios.buildNumber)")
          NEW=$((CURRENT + 1))
          node -e "
            const fs=require('fs');
            const p=require('./app.json');
            p.expo.ios.buildNumber=String($NEW);
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "build=$NEW" >> $GITHUB_OUTPUT
          echo "Build number bumped to $NEW"

      - name: Run expo prebuild
        run: |
          npx expo prebuild --platform ios --no-install --clean
          ls -la ios/

      - name: Patch ShareExtension signing in pbxproj
        # withManualIosSigning plugin only patches main app target, not
        # ShareExtension — possibly because expo-share-intent inserts that
        # config differently. Brute-force patch with node so we don't have to
        # debug the plugin.
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'ios/Chatyy.xcodeproj/project.pbxproj';
          let txt = fs.readFileSync(path, 'utf8');

          // For every buildSettings block containing the share-extension bundle
          // id, force manual signing + the right profile. Strategy: replace
          // CODE_SIGN_STYLE = Automatic with the full manual signing block.
          const SHAREEXT_PROFILE = 'd302e18b-f58a-43b8-8b1f-9bf4b2d05194';
          const TEAM = 'XN9XN27QCE';

          // Match each buildSettings block whose body contains share-extension
          txt = txt.replace(
            /(buildSettings = \{[^}]*?com\.onemundo\.mail\.share-extension[^}]*?\};)/g,
            (block) => {
              // Strip any existing CODE_SIGN_STYLE / PROVISIONING_PROFILE lines.
              let cleaned = block
                .replace(/\s+CODE_SIGN_STYLE = [^;]+;/g, '')
                .replace(/\s+PROVISIONING_PROFILE = [^;]+;/g, '')
                .replace(/\s+PROVISIONING_PROFILE_SPECIFIER = [^;]+;/g, '')
                .replace(/\s+"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = [^;]+;/g, '')
                .replace(/\s+CODE_SIGN_IDENTITY = [^;]+;/g, '')
                .replace(/\s+DEVELOPMENT_TEAM = [^;]+;/g, '');
              // Inject manual signing right before the closing };
              const inject =
                '\n\t\t\t\tCODE_SIGN_STYLE = Manual;' +
                '\n\t\t\t\tDEVELOPMENT_TEAM = ' + TEAM + ';' +
                '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";' +
                '\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";' +
                '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + SHAREEXT_PROFILE + '";' +
                '\n\t\t\t\tPROVISIONING_PROFILE = "' + SHAREEXT_PROFILE + '";';
              return cleaned.replace(/\s*\};$/, inject + '\n\t\t\t};');
            }
          );

          fs.writeFileSync(path, txt);
          console.log('Patched ShareExtension signing settings.');

          // Quick verification dump
          const blocks = txt.match(/buildSettings = \{[^}]*?com\.onemundo\.mail\.share-extension[^}]*?\};/g) || [];
          console.log('ShareExtension buildSettings blocks:', blocks.length);
          blocks.forEach((b, i) => {
            console.log('--- block', i, '---');
            ['CODE_SIGN_STYLE', 'DEVELOPMENT_TEAM', 'PROVISIONING_PROFILE_SPECIFIER', 'PROVISIONING_PROFILE'].forEach(k => {
              const m = b.match(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' = [^;]+;'));
              console.log(' ', m ? m[0] : `${k}: MISSING`);
            });
          });
          EOF

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Archive with xcodebuild
        run: |
          set -x
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          cd ios
          xcodebuild -workspace "$APP_NAME.xcworkspace" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            "OTHER_CODE_SIGN_FLAGS=--keychain=$KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        run: |
          set -x
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$MAIN_BUNDLE_ID</key><string>$MAIN_PROFILE_UUID</string>
              <key>$SHAREEXT_BUNDLE_ID</key><string>$SHAREEXT_PROFILE_UUID</string>
            </dict>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          cat /tmp/ExportOptions.plist

          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            "OTHER_CODE_SIGN_FLAGS=--keychain=$KEYCHAIN_PATH"

          # Move IPA to known path
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          cp "$IPA" ./build.ipa
          ls -la ./build.ipa

      - name: Submit to TestFlight
        # Auto-submit on push (the normal trigger), and on workflow_dispatch
        # only when submit=true. Set submit=false on workflow_dispatch to get
        # the .ipa as a download artifact instead.
        if: ${{ github.event_name == 'push' || inputs.submit == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_B64" ]; then
            echo "::error::Missing secret ASC_KEY_P8_BASE64 — required for App Store Connect auth."
            exit 1
          fi
          # Restore asc_key.p8 from secret (eas.json references ./asc_key.p8).
          echo "$ASC_KEY_B64" | base64 -d > ./asc_key.p8
          npx eas-cli submit \
            --platform ios \
            --profile production \
            --path ./build.ipa \
            --non-interactive
          rm -f ./asc_key.p8

      - name: Upload .ipa as artifact
        # Always upload so we have a recoverable copy even after submission.
        uses: actions/upload-artifact@v4
        with:
          name: chatyy-ios-${{ steps.bump.outputs.build }}
          path: ./build.ipa
          retention-days: 7

      - name: Commit bumped buildNumber back to repo
        # Only after successful submit, so failed builds don't burn build numbers.
        if: ${{ success() && (github.event_name == 'push' || inputs.submit == 'true') }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add app.json
          if git diff --cached --quiet; then
            echo "No buildNumber change to commit."
          else
            git commit -m "chore(ios): bump buildNumber to ${{ steps.bump.outputs.build }} [skip ci]"
            # Pull-rebase to avoid race with parallel pushes, then push.
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Wipe keychain + creds
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/$KEYCHAIN_NAME" 2>/dev/null || true
          rm -f /tmp/apple-dist.p12 /tmp/ExportOptions.plist || true

      - name: Report build time + cost
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          cost_cents=$(( (elapsed * 16 + 59) / 60 ))
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars}"
