name: Chatyy CI/CD

# Primary deploy path: the systemd timer `chatyy-auto-deploy.timer` on prod
# (217.216.67.99 — Contabo NY, since the 2026-04-27 migration off
# 69.62.103.131) polls origin/main every 60s and runs scripts/deploy.sh.
# That's what actually deploys most pushes.
#
# This workflow is the optional "instant deploy via SSH push" — when the
# secrets SSH_KEY + SERVER_HOST are configured, we SSH into prod and
# trigger the deploy immediately instead of waiting up to 60s.
#
# If the secrets AREN'T configured, we exit success with a message so the
# GitHub UI stays green. The systemd timer will deploy within a minute.
#
# Note (2026-05-01): deploy.sh now treats `eas-cli update` failures as
# warnings, not fatal errors, because EAS Update can reject SDK-55 manifests
# server-side ("sdkVersion 55.0.0 is not supported") which had been making
# every push go red despite the actual web deploy succeeding.

on:
  push:
    branches: [main, master, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Instant-deploy via SSH (falls back to systemd timer)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Check for deploy secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ] || [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_KEY or SERVER_HOST secret not configured."
            echo "::notice::The systemd auto-deploy timer on prod will pick up this commit within 60s."
            echo "::notice::To enable instant deploy, set secrets at https://github.com/${{ github.repository }}/settings/secrets/actions"
          else
            echo "status=configured" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.secrets.outputs.status == 'configured'
        id: ssh_setup
        run: |
          set +e
          mkdir -p ~/.ssh
          # Try secret as-is; if it lacks a trailing newline, openssh-client
          # rejects with "invalid format". Append \n defensively.
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Validate the key parses before attempting any connection.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::warning::SSH_KEY secret didn't parse (bad format / missing newline / wrong type). Falling back to systemd timer on prod."
            echo "result=bad_key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Best-effort host key. If host is unreachable we still continue.
          timeout 10 ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy on prod
        if: steps.secrets.outputs.status == 'configured' && steps.ssh_setup.outputs.result == 'ok'
        id: ssh_deploy
        # Pulls origin/<branch>, runs deploy.sh. The pre-flight check inside
        # deploy.sh refuses to proceed if /var/www/mail/api/ was wiped,
        # protecting against the rsync-delete disaster (2026-04-24).
        # If SSH fails (network / wrong host / firewall), we DON'T fail the
        # workflow — the systemd auto-deploy timer on prod polls origin every
        # 60s and will pick up the commit anyway. Marking this red on every
        # transient SSH glitch was masking real failures elsewhere.
        run: |
          set +e
          OUT=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            root@"${{ secrets.SERVER_HOST }}" \
            "set -e && cd /root/webmail-app && \
             export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_chatyy -o StrictHostKeyChecking=no' && \
             git fetch origin ${{ github.ref_name }} && \
             git reset --hard origin/${{ github.ref_name }} && \
             bash scripts/deploy.sh && \
             echo \${{ github.sha }} > /var/www/mail/.deployed_sha" 2>&1)
          STATUS=$?
          echo "$OUT" | tail -50
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::SSH deploy failed (exit $STATUS). Systemd timer on prod will deploy within 60s."
            echo "result=ssh_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Verify api/ still present
        if: steps.ssh_deploy.outputs.result == 'ok'
        run: |
          set +e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            root@"${{ secrets.SERVER_HOST }}" \
            "test -f /var/www/mail/api/email.php || { echo 'ERROR: api/email.php missing after deploy'; exit 1; }" || \
            echo "::warning::api/ verify check could not connect — assuming systemd timer will recover."
          exit 0

      - name: Deploy complete
        run: |
          if [ "${{ steps.secrets.outputs.status }}" = "skipped" ]; then
            echo "✓ Skipped instant-deploy (no secrets). Systemd timer on prod will deploy within 60s."
          elif [ "${{ steps.ssh_setup.outputs.result }}" = "bad_key" ]; then
            echo "⚠ SSH_KEY secret malformed. Systemd timer on prod will deploy within 60s. Re-add the secret with a trailing newline at https://github.com/${{ github.repository }}/settings/secrets/actions"
          elif [ "${{ steps.ssh_deploy.outputs.result }}" = "ssh_failed" ]; then
            echo "⚠ SSH deploy could not reach ${{ secrets.SERVER_HOST }}. Systemd timer on prod will deploy within 60s. (If the server moved IPs, update SERVER_HOST secret.)"
          else
            echo "✓ Instant deploy triggered and verified on ${{ secrets.SERVER_HOST }}."
          fi
