name: Chatyy CI/CD

# Deploy model: delegate to the prod server's scripts/deploy.sh over SSH
# rather than replicating the build environment on a GitHub runner. Why:
#   1. The prod server's Node/Expo/EAS/plugin state is what actually works;
#      GitHub's ubuntu-latest image often diverges (peer deps, cached
#      native modules, plugin resolution).
#   2. The same script is used by the systemd auto-deploy timer (belt +
#      suspenders fallback), so any CI-only failure also happens on the
#      cron path and we'd catch it twice.
#   3. No artifact upload/download between jobs — cuts run time 2-3x.
#
# If this workflow disappears or fails, the systemd timer on prod
# (chatyy-auto-deploy.timer) will still deploy every push within 60s.

on:
  push:
    branches: [main, master, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy web + OTA via prod server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger deploy on prod
        # Pulls origin/master, runs deploy.sh. The pre-flight check in
        # deploy.sh will refuse to proceed if /var/www/mail/api/ is missing,
        # which protects against the rsync-delete disaster (2026-04-24).
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@"${{ secrets.SERVER_HOST }}" \
            "set -e && cd /root/webmail-app && \
             export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_chatyy -o StrictHostKeyChecking=no' && \
             git fetch origin ${{ github.ref_name }} && \
             git reset --hard origin/${{ github.ref_name }} && \
             if git diff --name-only HEAD@{1} HEAD | grep -qE '^package(-lock)?\\.json$'; then \
               npm ci --prefer-offline --no-audit --no-fund; \
             fi && \
             bash scripts/deploy.sh && \
             echo \${{ github.sha }} > /var/www/mail/.deployed_sha"

      - name: Verify api/ still present
        # Last-line guardrail — if something inside deploy.sh wiped api/,
        # fail loudly. deploy.sh already does this internally but the
        # explicit check in CI also makes the failure visible on GitHub.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@"${{ secrets.SERVER_HOST }}" \
            "test -f /var/www/mail/api/email.php || { echo 'ERROR: api/email.php missing after deploy'; exit 1; }"
