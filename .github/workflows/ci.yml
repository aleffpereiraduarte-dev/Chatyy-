name: Chatyy CI/CD

# Primary deploy path: the systemd timer `chatyy-auto-deploy.timer` on prod
# (217.216.67.99 — Contabo NY, since the 2026-04-27 migration off
# 69.62.103.131) polls origin/main every 60s and runs scripts/deploy.sh.
# That's what actually deploys most pushes.
#
# This workflow is the optional "instant deploy via SSH push" — when the
# secrets SSH_KEY + SERVER_HOST are configured, we SSH into prod and
# trigger the deploy immediately instead of waiting up to 60s.
#
# If the secrets AREN'T configured, we exit success with a message so the
# GitHub UI stays green. The systemd timer will deploy within a minute.
#
# Note (2026-05-01): deploy.sh now treats `eas-cli update` failures as
# warnings, not fatal errors, because EAS Update can reject SDK-55 manifests
# server-side ("sdkVersion 55.0.0 is not supported") which had been making
# every push go red despite the actual web deploy succeeding.

on:
  push:
    branches: [main, master, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Instant-deploy via SSH (falls back to systemd timer)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Check for deploy secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ] || [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_KEY or SERVER_HOST secret not configured."
            echo "::notice::The systemd auto-deploy timer on prod will pick up this commit within 60s."
            echo "::notice::To enable instant deploy, set secrets at https://github.com/${{ github.repository }}/settings/secrets/actions"
          else
            echo "status=configured" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.secrets.outputs.status == 'configured'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger deploy on prod
        if: steps.secrets.outputs.status == 'configured'
        # Pulls origin/<branch>, runs deploy.sh. The pre-flight check inside
        # deploy.sh refuses to proceed if /var/www/mail/api/ was wiped,
        # protecting against the rsync-delete disaster (2026-04-24).
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@"${{ secrets.SERVER_HOST }}" \
            "set -e && cd /root/webmail-app && \
             export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_chatyy -o StrictHostKeyChecking=no' && \
             git fetch origin ${{ github.ref_name }} && \
             git reset --hard origin/${{ github.ref_name }} && \
             bash scripts/deploy.sh && \
             echo \${{ github.sha }} > /var/www/mail/.deployed_sha"

      - name: Verify api/ still present
        if: steps.secrets.outputs.status == 'configured'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@"${{ secrets.SERVER_HOST }}" \
            "test -f /var/www/mail/api/email.php || { echo 'ERROR: api/email.php missing after deploy'; exit 1; }"

      - name: Deploy complete
        run: |
          if [ "${{ steps.secrets.outputs.status }}" = "skipped" ]; then
            echo "✓ Systemd timer on prod will deploy this commit within 60 seconds."
          else
            echo "✓ Instant deploy triggered and verified on ${{ secrets.SERVER_HOST }}."
          fi
