name: OTA Publish (EAS Update)

# OTA push — runs on ubuntu-latest (~$0.008/min, total ~$0.01).
# Use for any JS-only change. Goes live to all users on next app open.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'OTA message (shown in EAS dashboard)'
        required: true
        default: 'OTA update'
      branch:
        description: 'EAS branch (production, preview)'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'preview'
  # Auto-OTA on push DISABLED 2026-05-07 — was racing with scripts/ship.sh ota
  # and re-publishing stale OTAs on top of fresh fixes (e.g. dependabot's
  # "fix(deps): regenerate package-lock" commit kept overriding new code,
  # reverting login form to broken state). scripts/ship.sh ota is now the
  # canonical OTA path. For manual OTA without ship.sh, use workflow_dispatch.
  # push:
  #   branches: [main, master]
  #   paths:
  #     - 'app/**'
  #     - 'components/**'
  #     - 'services/**'
  #     - 'context/**'
  #     - 'i18n/**'
  #     - 'constants/**'
  #     - 'package.json'
  #     - 'package-lock.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sanity check — EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            echo "Generate a token at: https://expo.dev/accounts/aleffduarte/settings/access-tokens"
            exit 1
          fi
          echo "EXPO_TOKEN is set (${#}). OK."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! npx eas-cli whoami; then
            echo "::error::EAS auth failed. Check that EXPO_TOKEN is valid (not expired/revoked)."
            exit 1
          fi

      # Catches duplicate-export and parse errors before we waste Expo bandwidth
      # on a bundle that will explode mid-export. Burned us in OTA rounds 3 + 5.
      - name: Pre-flight syntax + dup-symbol check
        run: bash scripts/predeploy-check.sh

      # Local bundle dry-run — if the JS bundle won't compile, fail fast
      # without hitting Expo's CDN at all. Adds ~60s but saves 5–10min on
      # broken commits and prevents the ugly "Export failed" red runs.
      - name: Bundle dry-run (catch syntax errors before publish)
        run: |
          set -e
          echo "Compiling JS bundle locally to validate before EAS publish..."
          NODE_ENV=production npx expo export --platform ios --output-dir /tmp/precheck-dist 2>&1 | tail -20
          rm -rf /tmp/precheck-dist

      - name: Publish OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MSG="${{ inputs.message || format('Auto OTA — {0}', github.sha) }}"
          BRANCH="${{ inputs.branch || 'production' }}"
          set +e
          OUT=$(npx eas-cli update \
            --branch "$BRANCH" \
            --environment production \
            --message "$MSG" \
            --non-interactive 2>&1)
          STATUS=$?
          echo "$OUT"
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "✓ OTA published"
            exit 0
          fi
          # Soft-fail on the well-known Expo platform glitch where SDK-55
          # manifests are rejected server-side ("sdkVersion X is not
          # supported"). The native build pipeline (build-ios + Android
          # self-host) covers user delivery for these cases. Mark the run
          # as a *warning* instead of red so we can still see real OTA
          # failures (auth, missing token, syntax errors).
          if echo "$OUT" | grep -qE 'sdkVersion .* is not supported'; then
            echo "::warning::EAS Update rejected the manifest with the known SDK-55 platform glitch — falling back to native build path."
            echo "Request ID for Expo support: $(echo "$OUT" | grep -oE 'Request ID: [a-f0-9-]+' | head -1)"
            exit 0
          fi
          # Real failure (auth, syntax, etc.) — actually go red.
          exit "$STATUS"
