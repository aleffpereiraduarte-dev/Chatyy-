name: OTA Publish (EAS Update)

# OTA push — runs on ubuntu-latest (~$0.008/min, total ~$0.01).
# Use for any JS-only change. Goes live to all users on next app open.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'OTA message (shown in EAS dashboard)'
        required: true
        default: 'OTA update'
      branch:
        description: 'EAS branch (production, preview)'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'preview'
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'components/**'
      - 'services/**'
      - 'context/**'
      - 'i18n/**'
      - 'constants/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sanity check — EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            echo "Generate a token at: https://expo.dev/accounts/aleffduarte/settings/access-tokens"
            exit 1
          fi
          echo "EXPO_TOKEN is set (${#}). OK."

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! npx eas-cli whoami; then
            echo "::error::EAS auth failed. Check that EXPO_TOKEN is valid (not expired/revoked)."
            exit 1
          fi

      - name: Publish OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          MSG="${{ inputs.message || format('Auto OTA — {0}', github.sha) }}"
          BRANCH="${{ inputs.branch || 'production' }}"
          npx eas-cli update \
            --branch "$BRANCH" \
            --environment production \
            --message "$MSG" \
            --non-interactive
