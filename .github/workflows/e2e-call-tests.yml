name: e2e-call-tests

# [2026-10-11] Teste REAL de ligação 1:1 (apitest -> qa2) — mesma lógica do
# /root/ligacao-melhorias/01-testar-ligacao.sh: sinalização no hub Go de produção
# (wss://ws.chatyy.com.br/ws), mídia no LiveKit de produção, 2 Chromium com mic
# falso (Playwright). O callee pode rodar num network namespace próprio
# (slirp4netns) para simular quedas de rede de 3s/10s/25s sem mexer em firewall.
# Não muda nada em produção (só cria ligações de teste entre as contas QA).
#
# Antes: runner [self-hosted, prod] + build de APK no Mac 207 (aposentado) →
# nunca rodava. Agora: runner ubuntu do GitHub (nada roda no servidor de prod).
#
# SEGURANÇA (repositório PÚBLICO): sem pull_request / pull_request_target / push.
# Só workflow_dispatch (quem tem escrita no repo) e agenda diária. As senhas QA
# vêm de secrets (nunca impressas); secrets não são expostos a forks.
#
# Secrets necessários (o founder cadastra uma vez — o valor é pedido no prompt,
# nada fica no histórico do shell):
#   gh secret set QA_APITEST_PASSWORD --repo aleffpereiraduarte-dev/Chatyy-
#   gh secret set QA_QA2_PASSWORD     --repo aleffpereiraduarte-dev/Chatyy-
# (mesmos valores de APITEST_PASSWORD / QA2_PASSWORD em /etc/mail-api.env)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Cenários (vírgula): basic, turn, outage, lk, tune — ou all"
        required: false
        default: "basic,turn,outage"
  schedule:
    # Diário 09:17 UTC (06:17 BRT) — fora do pico de uso.
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-call-tests
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAN: ${{ github.event.inputs.plan || 'basic,turn,outage' }}
      QA_APITEST_PASSWORD: ${{ secrets.QA_APITEST_PASSWORD }}
      QA_QA2_PASSWORD: ${{ secrets.QA_QA2_PASSWORD }}
    steps:
      - name: Secrets presentes?
        run: |
          missing=""
          [ -n "$QA_APITEST_PASSWORD" ] || missing="$missing QA_APITEST_PASSWORD"
          [ -n "$QA_QA2_PASSWORD" ] || missing="$missing QA_QA2_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltam secrets:$missing. Cadastre com: gh secret set <NOME> --repo ${{ github.repository }}"
            exit 1
          fi
          case "$PLAN" in
            *[!a-z,]*) echo "::error::plan inválido: só letras minúsculas e vírgulas"; exit 1;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/e2e/call
          sparse-checkout-cone-mode: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Playwright + Chromium (+ slirp4netns p/ quedas de rede)
        working-directory: scripts/e2e/call
        run: |
          set -e
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.59.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends slirp4netns iproute2 >/dev/null

      - name: Login das contas QA
        working-directory: scripts/e2e/call
        run: bash mint-ci.sh "$RUNNER_TEMP/bearers.json"

      - name: Ligações de teste
        id: run
        working-directory: scripts/e2e/call
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          # root: o cenário "outage" cria um network namespace (ip netns) p/ o callee.
          sudo -E env "PATH=$PATH" \
            PW_MODULE="$PWD/node_modules/playwright" \
            PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
            BEARERS="$RUNNER_TEMP/bearers.json" \
            QA_OUT="$RUNNER_TEMP/out" \
            timeout --kill-after=30 1500 node call_e2e.js "$PLAN" > "$RUNNER_TEMP/out/saida.txt" 2>&1
          echo "node_exit=$?" >> "$GITHUB_OUTPUT"
          # Log sem tokens (o script nunca imprime bearer); só as linhas de progresso.
          grep -v '^###' "$RUNNER_TEMP/out/saida.txt" | tail -n 80 || true

      - name: Resultado
        run: python3 -B scripts/e2e/call/summarize.py "$RUNNER_TEMP/out/call_e2e.json"

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-call-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/out/call_e2e.json
            ${{ runner.temp }}/out/saida.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Limpeza
        if: always()
        run: |
          sudo ip netns del qacall 2>/dev/null || true
          rm -f "$RUNNER_TEMP/bearers.json"
