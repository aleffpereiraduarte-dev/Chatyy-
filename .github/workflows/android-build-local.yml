name: Android Build (local, GitHub Linux runner)

# Builds .aab on ubuntu-latest (~$0.008/min × ~12 min = ~$0.10 per build).

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sanity check — EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it at:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi
          echo "EXPO_TOKEN is set. OK."

      - uses: actions/checkout@v4

      - name: Record start
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli whoami

      - name: Build Android .aab locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./build.aab

      - name: Submit to Google Play
        if: ${{ inputs.submit == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit \
            --platform android \
            --profile production \
            --path ./build.aab \
            --non-interactive

      - name: Upload .aab as artifact
        if: ${{ inputs.submit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chatyy-android-${{ github.run_number }}
          path: ./build.aab
          retention-days: 7

      - name: Report build time + cost
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          # ubuntu-latest: $0.008/min on private repos.
          cost_cents=$(awk -v e="$elapsed" 'BEGIN { printf "%d", (e * 8 + 599) / 600 }')
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars} (private repo, ubuntu-latest @ \$0.008/min)"
