name: Android Build (self-hosted, prod 18-vCPU)

# Builds .aab on the self-hosted runner running on chatyy-prod
# (217.216.67.99, 18 vCPU / 94GB RAM, Ubuntu 26.04, Android SDK preinstalled
# at $ANDROID_HOME). Expected build time ~5-8min cold, ~3-5min warm cache.
# No per-minute cost — server is already paid for.
#
# Hosted GitHub runners (ubuntu-latest 2-core, macos-latest 3-core) both
# timed out at the 45-60min envelope on this app's gradle build.
#
# Triggered by:
#   - workflow_dispatch (manual; choose submit yes/no)
#   - push to .github/triggers/mobile-build.txt → also fires iOS in parallel

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    paths:
      - '.github/triggers/mobile-build.txt'

permissions:
  contents: write

jobs:
  build:
    # 2026-05-22: switched to macos-latest-xlarge (same as iOS workflow).
    # User reported self-hosted Ryzen too slow today (~17-40min runs).
    # macos-latest-xlarge has Android SDK pre-installed and 6 vCPU =
    # ~8-12min builds. Billing already paid via iOS workflow.
    runs-on: macos-latest-xlarge
    timeout-minutes: 60
    steps:
      - name: Sanity check — required secrets
        run: |
          missing=()
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing+=("EXPO_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          echo "EXPO_TOKEN is set. OK."

      - uses: actions/checkout@v4
        with:
          # Need full history so the bump-commit step can rebase.
          fetch-depth: 0

      - name: Record start
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # macos-latest-xlarge has Android SDK pre-installed at
      # /Users/runner/Library/Android/sdk via ANDROID_HOME env var.
      - name: Configure Android SDK env
        run: |
          : "${ANDROID_HOME:=/Users/runner/Library/Android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "Resolved ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools" 2>/dev/null | head -3 || echo "WARN: platform-tools missing"

      - name: Stage Play SA key + ASC key from secrets
        env:
          GOOGLE_PLAY_SA_KEY_BASE64: ${{ secrets.GOOGLE_PLAY_SA_KEY_BASE64 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -n "$GOOGLE_PLAY_SA_KEY_BASE64" ]; then
            echo "$GOOGLE_PLAY_SA_KEY_BASE64" | base64 -d > ./gcloud-sa-key.json
            chmod 600 ./gcloud-sa-key.json
            echo "Play SA key staged from secret."
          elif [ -f /var/lib/ghrunner-secrets/gcloud-sa-key.json ]; then
            cp /var/lib/ghrunner-secrets/gcloud-sa-key.json ./gcloud-sa-key.json
            chmod 600 ./gcloud-sa-key.json
            echo "Play SA key staged from filesystem."
          else
            echo "::warning::No Play SA key found — Play submit will be skipped."
          fi
          if [ -n "$ASC_KEY_P8_BASE64" ]; then
            echo "$ASC_KEY_P8_BASE64" | base64 -d > ./asc_key.p8
            chmod 600 ./asc_key.p8
          elif [ -f /var/lib/ghrunner-secrets/asc_key.p8 ]; then
            cp /var/lib/ghrunner-secrets/asc_key.p8 ./asc_key.p8
            chmod 600 ./asc_key.p8
          fi

      # Gradle cache lives in $HOME on the self-hosted runner — persists
      # across runs naturally, so the actions/cache layer is just a safety
      # net for when the runner is wiped.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli whoami

      - name: Bump android.versionCode
        id: bump
        run: |
          CURRENT=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          NEW=$((CURRENT + 1))
          node -e "
            const fs=require('fs');
            const p=require('./app.json');
            p.expo.android.versionCode=$NEW;
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "build=$NEW" >> $GITHUB_OUTPUT
          echo "versionCode bumped to $NEW"

      - name: Build Android .aab locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Belt-and-suspenders: $GITHUB_ENV propagates between steps but the
          # eas-cli-local-build-plugin spawns gradle in /tmp/runner/eas-build-
          # local-nodejs/<uuid>/build/android/ — and a stale gradle daemon (or
          # the spawn API on this runner) loses ANDROID_HOME. Setting it at
          # step env guarantees the immediate child process sees it. Gradle
          # falls back from ANDROID_HOME → ANDROID_SDK_ROOT → local.properties,
          # so we feed all three.
          ANDROID_HOME: /Users/runner/Library/Android/sdk
          ANDROID_SDK_ROOT: /Users/runner/Library/Android/sdk
          # [2026-05-22] Bump Gradle heap on macos-latest-xlarge.
          # Default 2GB caused D8 OOM in :app:mergeDexRelease (100+ native
          # modules). macos-latest-xlarge has 14GB total — 6GB heap is safe.
          GRADLE_OPTS: '-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.jvmargs=-Xmx6144m'
          _JAVA_OPTIONS: '-Xmx6144m'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          # Kill any orphan gradle daemons that may still hold env from a
          # previous run without ANDROID_HOME — they'd crash with the same
          # "SDK location not found" otherwise.
          pkill -f 'GradleDaemon' 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true
          npx eas-cli build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./build.aab

      - name: Submit to Google Play
        # Auto-submit on push (mirrors iOS workflow). Manual dispatch obeys input.
        # Skip silently if gcloud-sa-key.json missing on the runner — the AAB
        # is still uploaded as artifact so it can be submitted manually.
        #
        # FGS-declaration quirk (2026-05-18): if AAB introduces a new
        # FOREGROUND_SERVICE_* permission that hasn't been declared in
        # Play Console > App content > Foreground services, Google's
        # Publishing API rejects the submission on EVERY track (including
        # internal) with: "You must let us know whether your app uses any
        # Foreground Service permissions". There is no API endpoint to
        # toggle the declaration — it MUST be done once in the Play Console
        # UI. We detect this exact error below and emit a loud annotation
        # with step-by-step instructions.
        id: play_submit
        if: ${{ (github.event_name == 'push' || inputs.submit == 'true') && hashFiles('gcloud-sa-key.json') != '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        continue-on-error: true
        run: |
          set +e
          npx eas-cli submit \
            --platform android \
            --profile production \
            --path ./build.aab \
            --non-interactive 2>&1 | tee submit.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> $GITHUB_OUTPUT
          exit $rc

      - name: Detect FGS-declaration rejection and surface fix steps
        if: ${{ steps.play_submit.outcome == 'failure' && hashFiles('submit.log') != '' }}
        run: |
          if grep -qiE "Foreground Service permissions|foreground service.*declaration|let us know whether your app uses any Foreground" submit.log; then
            {
              echo "## Play submit rejected: Foreground Services declaration missing"
              echo ""
              echo "The AAB uploaded fine but Google rejected the track update because"
              echo "one or more \`FOREGROUND_SERVICE_*\` permissions in this build have"
              echo "NOT been declared in Play Console. This is a one-time manual step"
              echo "per new FGS type. **Fastlane/Publisher API cannot fix this —"
              echo "there is no API endpoint for the declaration form.**"
              echo ""
              echo "### Action required (5 min, done once)"
              echo ""
              echo "1. Open <https://play.google.com/console/> → select **Chatyy**"
              echo "   (package \`com.onemundo.mail\`) → **Policy** (or \"Política e"
              echo "   programas\") → **App content** → **Foreground services**."
              echo "2. Click **Manage**."
              echo "3. Tick every checkbox the app uses:"
              echo "   - \`phoneCall\` — LiveKit voice/video calls (CallRingingService, CallOngoingService)"
              echo "   - \`mediaPlayback\` — background audio (expo-audio AudioControlsService)"
              echo "   - \`dataSync\` — silent FCM wake relay + photo backup (RelayWakeService, expo-background-upload)"
              echo "   - \`mediaProjection\` — screen share in live streams (ScreenShareService)"
              echo "4. For each, paste the justification copy below."
              echo "5. **Save**."
              echo "6. Re-run this workflow (or push any commit) — the submit will now succeed"
              echo "   and will continue to succeed for every future build until a NEW FGS"
              echo "   type is introduced."
              echo ""
              echo "### Justification copy (paste verbatim)"
              echo ""
              echo "- **phoneCall**: \"App is a calling/messaging app. Foreground service is used to keep the audio/video LiveKit room alive during an active 1:1 or group call when the user backgrounds the app. Service starts only after the user accepts an incoming call or places an outgoing call, and stops when the call ends.\""
              echo "- **mediaPlayback**: \"Background playback of voice messages and shared audio attachments. Service starts only when the user taps play on an audio message and continues until playback ends or the user dismisses the media notification.\""
              echo "- **dataSync**: \"Silent push wakes the app to sync chat messages and to relay state to the user's other signed-in devices. Service starts only on receipt of an FCM data message, performs the sync, and stops within seconds. Also used for resumable photo/video uploads via WorkManager.\""
              echo "- **mediaProjection**: \"User-initiated screen sharing during a live broadcast or video call. Service starts only after the user accepts the system MediaProjection consent dialog and stops when the user ends sharing.\""
              echo ""
              echo "### What we already do automatically"
              echo ""
              echo "- Every \`FOREGROUND_SERVICE_*\` permission this app uses is declared in"
              echo "  \`app.json > expo.android.permissions\` so it's visible in code review."
              echo "- This workflow captures the submit output, detects this specific"
              echo "  failure, and prints exactly which checkboxes to tick."
              echo "- The AAB is always uploaded as a workflow artifact"
              echo "  (\`chatyy-android-${{ steps.bump.outputs.build }}\`) so you can"
              echo "  also drag-drop into Play Console UI if you need to ship now —"
              echo "  the UI accepts uploads even before the declaration is filled."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Play submit rejected — FGS declaration missing::Open the workflow Summary tab for a 5-min fix. AAB artifact is uploaded for manual upload as fallback."
            exit 1
          else
            echo "::error title=Play submit failed::See submit.log artifact for details."
            exit 1
          fi

      - name: Upload submit.log on failure
        if: ${{ always() && steps.play_submit.outcome == 'failure' && hashFiles('submit.log') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: play-submit-log-${{ steps.bump.outputs.build }}
          path: ./submit.log
          retention-days: 7

      - name: Note about skipped submit
        if: ${{ (github.event_name == 'push' || inputs.submit == 'true') && hashFiles('gcloud-sa-key.json') == '' }}
        run: echo "::warning::gcloud-sa-key.json not found on runner — Play submit skipped. AAB uploaded as artifact for manual submit."

      - name: Upload .aab as artifact
        # Always run, even if submit failed — we want the AAB recoverable.
        if: always() && hashFiles('build.aab') != ''
        uses: actions/upload-artifact@v7
        with:
          name: chatyy-android-${{ steps.bump.outputs.build }}
          path: ./build.aab
          retention-days: 7

      - name: Commit bumped versionCode back to repo
        # SEMPRE commita o bump se o build do AAB foi success — mesmo que o Submit
        # falhe depois. Sem isso, o app.json fica com versionCode velho, próxima
        # build bumpa pro mesmo número, e o Submit dá "version already submitted"
        # eternamente (incidente 2026-05-18: 3 builds em loop com versionCode 353).
        if: ${{ always() && steps.bump.outputs.build != '' && hashFiles('build.aab') != '' }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add app.json
          if git diff --cached --quiet; then
            echo "No versionCode change to commit."
          else
            git commit -m "chore(android): bump versionCode to ${{ steps.bump.outputs.build }} [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Report build time + cost
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          # macos-latest: $0.16/min on private repos.
          cost_cents=$(( (elapsed * 16 + 59) / 60 ))
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars} (private repo, macos-latest @ \$0.16/min)"
