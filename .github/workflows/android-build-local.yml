name: Android Build (local, GitHub Linux runner)

# Builds .aab on ubuntu-latest (~$0.008/min × ~12 min = ~$0.10 per build).
# Triggered by:
#   - workflow_dispatch (manual; choose submit yes/no)
#   - push to .github/triggers/mobile-build.txt → also fires iOS in parallel

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.github/triggers/mobile-build.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sanity check — required secrets
        run: |
          missing=()
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing+=("EXPO_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          echo "EXPO_TOKEN is set. OK."

      - uses: actions/checkout@v4
        with:
          # Need full history so the bump-commit step can rebase.
          fetch-depth: 0

      - name: Record start
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli whoami

      - name: Bump android.versionCode
        id: bump
        run: |
          CURRENT=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          NEW=$((CURRENT + 1))
          node -e "
            const fs=require('fs');
            const p=require('./app.json');
            p.expo.android.versionCode=$NEW;
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "build=$NEW" >> $GITHUB_OUTPUT
          echo "versionCode bumped to $NEW"

      - name: Build Android .aab locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          # We pre-bumped versionCode above; pass --no-wait isn't relevant for
          # local. EAS local will respect the value already in app.json.
          npx eas-cli build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./build.aab

      - name: Submit to Google Play
        # Auto-submit on push (mirrors iOS workflow). Manual dispatch obeys input.
        if: ${{ github.event_name == 'push' || inputs.submit == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit \
            --platform android \
            --profile production \
            --path ./build.aab \
            --non-interactive

      - name: Upload .aab as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatyy-android-${{ steps.bump.outputs.build }}
          path: ./build.aab
          retention-days: 7

      - name: Commit bumped versionCode back to repo
        if: ${{ success() && (github.event_name == 'push' || inputs.submit == 'true') }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add app.json
          if git diff --cached --quiet; then
            echo "No versionCode change to commit."
          else
            git commit -m "chore(android): bump versionCode to ${{ steps.bump.outputs.build }} [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Report build time + cost
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          # ubuntu-latest: $0.008/min on private repos.
          cost_cents=$(awk -v e="$elapsed" 'BEGIN { printf "%d", (e * 8 + 599) / 600 }')
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars} (private repo, ubuntu-latest @ \$0.008/min)"
