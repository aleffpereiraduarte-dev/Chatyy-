name: Android Build (self-hosted, prod 18-vCPU)

# Builds .aab on the self-hosted runner running on chatyy-prod
# (217.216.67.99, 18 vCPU / 94GB RAM, Ubuntu 26.04, Android SDK preinstalled
# at /opt/android-sdk). Expected build time ~5-8min cold, ~3-5min warm cache.
# No per-minute cost — server is already paid for.
#
# Hosted GitHub runners (ubuntu-latest 2-core, macos-latest 3-core) both
# timed out at the 45-60min envelope on this app's gradle build.
#
# Triggered by:
#   - workflow_dispatch (manual; choose submit yes/no)
#   - push to .github/triggers/mobile-build.txt → also fires iOS in parallel

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    paths:
      - '.github/triggers/mobile-build.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, android-build]
    timeout-minutes: 30
    steps:
      - name: Sanity check — required secrets
        run: |
          missing=()
          [ -z "${{ secrets.EXPO_TOKEN }}" ] && missing+=("EXPO_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            exit 1
          fi
          echo "EXPO_TOKEN is set. OK."

      - uses: actions/checkout@v4
        with:
          # Need full history so the bump-commit step can rebase.
          fetch-depth: 0

      - name: Record start
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # Self-hosted runner has Android SDK at /opt/android-sdk preinstalled.
      # No setup-android step needed — just point EAS/Gradle at it.
      - name: Configure Android SDK env
        run: |
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          ls /opt/android-sdk/platform-tools 2>/dev/null | head -3 || echo "WARN: platform-tools missing"

      # Gradle cache lives in $HOME on the self-hosted runner — persists
      # across runs naturally, so the actions/cache layer is just a safety
      # net for when the runner is wiped.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli whoami

      - name: Bump android.versionCode
        id: bump
        run: |
          CURRENT=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          NEW=$((CURRENT + 1))
          node -e "
            const fs=require('fs');
            const p=require('./app.json');
            p.expo.android.versionCode=$NEW;
            fs.writeFileSync('./app.json', JSON.stringify(p, null, 2) + '\n');
          "
          echo "build=$NEW" >> $GITHUB_OUTPUT
          echo "versionCode bumped to $NEW"

      - name: Build Android .aab locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_ALLOW_FAILURE: 'true'
        run: |
          npx eas-cli build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./build.aab

      - name: Submit to Google Play
        # Auto-submit on push (mirrors iOS workflow). Manual dispatch obeys input.
        # Skip silently if gcloud-sa-key.json missing on the runner — the AAB
        # is still uploaded as artifact so it can be submitted manually.
        if: ${{ (github.event_name == 'push' || inputs.submit == 'true') && hashFiles('gcloud-sa-key.json') != '' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit \
            --platform android \
            --profile production \
            --path ./build.aab \
            --non-interactive

      - name: Note about skipped submit
        if: ${{ (github.event_name == 'push' || inputs.submit == 'true') && hashFiles('gcloud-sa-key.json') == '' }}
        run: echo "::warning::gcloud-sa-key.json not found on runner — Play submit skipped. AAB uploaded as artifact for manual submit."

      - name: Upload .aab as artifact
        # Always run, even if submit failed — we want the AAB recoverable.
        if: always() && hashFiles('build.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: chatyy-android-${{ steps.bump.outputs.build }}
          path: ./build.aab
          retention-days: 7

      - name: Commit bumped versionCode back to repo
        if: ${{ success() && (github.event_name == 'push' || inputs.submit == 'true') }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add app.json
          if git diff --cached --quiet; then
            echo "No versionCode change to commit."
          else
            git commit -m "chore(android): bump versionCode to ${{ steps.bump.outputs.build }} [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Report build time + cost
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$((end - ${{ steps.timer.outputs.start }}))
          minutes=$((elapsed / 60))
          seconds=$((elapsed % 60))
          # macos-latest: $0.16/min on private repos.
          cost_cents=$(( (elapsed * 16 + 59) / 60 ))
          dollars=$(awk -v c="$cost_cents" 'BEGIN { printf "%.2f", c/100 }')
          echo "::notice title=Build duration::${minutes}m ${seconds}s"
          echo "::notice title=Estimated cost::~\$${dollars} (private repo, macos-latest @ \$0.16/min)"
