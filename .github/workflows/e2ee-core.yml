name: E2EE core (chatyy-crypto v5 + legado v4)

# [2026-10-21 WP-02] Núcleo E2EE v5 `native/chatyy-crypto` (matrix-sdk-crypto =0.18.0):
#   test     cargo test do núcleo (Linux)
#   android  .so arm64/armv7/x86_64 (16 KB) + bindings Kotlin + smoke Kotlin/JVM (JNA, coroutines)
#   wasm     wasm + glue (wasm-bindgen) + smoke em Node
#   ios      ChatyyCryptoCore.xcframework + bindings Swift + smoke Swift (macOS) + link app/NSE arm64
#   package  junta tudo, tamanhos no resumo, SHA256SUMS; release=true publica os assets que os
#            builds do app baixam (ci/prebuilt.lock). O APP não depende disto até o input
#            chatyy_crypto=true (ios/android-build-local.yml), que recusa submit.
# core=prova = núcleo TEMPORÁRIO (ci/prova-core) até o WP-01 exportar a API; depois core=real
# (ou a variável do repo CHATYY_CRYPTO_CORE=real).
# v4=true roda também os jobs antigos do E2EE v4 (native/e2ee), sem mudança.

on:
  workflow_dispatch:
    inputs:
      core:
        description: 'Núcleo (auto = variável do repo ou prova; real = native/chatyy-crypto)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'prova', 'real']
      release:
        description: 'Publicar release pré-compilado (só core=real)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      v4:
        description: 'Rodar também os jobs do E2EE v4 (legado)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths:
      - 'native/chatyy-crypto/**'
      - 'vendor/chatyy-crypto-wasm/rust/**'
      - '.github/workflows/e2ee-core.yml'

concurrency:
  group: e2ee-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CHATYY_CRYPTO_CORE: ${{ (inputs.core && inputs.core != 'auto') && inputs.core || vars.CHATYY_CRYPTO_CORE || 'prova' }}
  CHATYY_RUST_TOOLCHAIN: '1.95.0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cc-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ github.workspace }}/../cc-target
          key: cc-test-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-${{ hashFiles('native/chatyy-crypto/Cargo.lock', 'native/chatyy-crypto/ci/prova-core/Cargo.lock') }}
          restore-keys: cc-test-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-
      - name: cargo test
        run: bash native/chatyy-crypto/ci/test.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cc-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
            ${{ runner.tool_cache }}/chatyy-crypto-tools
            ${{ github.workspace }}/../cc-target
          key: cc-android-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-${{ hashFiles('native/chatyy-crypto/Cargo.lock', 'native/chatyy-crypto/ci/prova-core/Cargo.lock', 'native/chatyy-crypto/ci/uniffi-bindgen/Cargo.lock') }}
          restore-keys: cc-android-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-
      - name: .so (3 ABIs, 16 KB) + bindings Kotlin + AAR
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          bash native/chatyy-crypto/build-android.sh
      - name: Smoke Kotlin/JVM (bindings + JNA + coroutines)
        run: bash native/chatyy-crypto/ci/smoke-kotlin.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cc-android
          path: |
            native/chatyy-crypto/dist/android
            native/chatyy-crypto/dist/bindings/kotlin
          retention-days: 14

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cc-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/wasm-bindgen
            ${{ github.workspace }}/../cc-target
          key: cc-wasm-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-${{ hashFiles('vendor/chatyy-crypto-wasm/rust/Cargo.lock', 'native/chatyy-crypto/ci/prova-core/Cargo.lock') }}
          restore-keys: cc-wasm-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-
      - name: binaryen (wasm-opt)
        run: sudo apt-get install -y -qq binaryen >/dev/null || true
      - name: wasm + glue (web e nodejs)
        run: bash native/chatyy-crypto/build-wasm.sh
      - name: Smoke wasm em Node
        run: bash native/chatyy-crypto/ci/smoke-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cc-wasm
          path: native/chatyy-crypto/dist/wasm
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cc-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ github.workspace }}/../cc-target
          key: cc-ios-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-${{ hashFiles('native/chatyy-crypto/Cargo.lock', 'native/chatyy-crypto/ci/prova-core/Cargo.lock', 'native/chatyy-crypto/ci/uniffi-bindgen/Cargo.lock') }}
          restore-keys: cc-ios-${{ env.CHATYY_CRYPTO_CORE }}-${{ env.CHATYY_RUST_TOOLCHAIN }}-
      - name: xcframework + bindings Swift + link arm64 (app e NSE)
        run: bash native/chatyy-crypto/build-ios.sh
      - name: Smoke Swift (macOS, async real)
        run: bash native/chatyy-crypto/ci/smoke-swift.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cc-ios
          path: |
            native/chatyy-crypto/dist/ios/ChatyyCryptoCore.xcframework
            native/chatyy-crypto/dist/ios/size-report.txt
            native/chatyy-crypto/dist/bindings/swift
          retention-days: 14

  package:
    needs: [test, android, wasm, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cc-android, path: native/chatyy-crypto/dist }
      - uses: actions/download-artifact@v4
        with: { name: cc-wasm, path: native/chatyy-crypto/dist/wasm }
      - uses: actions/download-artifact@v4
        with: { name: cc-ios, path: native/chatyy-crypto/dist }
      - name: Pacotes + SHA256SUMS + tamanhos
        id: pkg
        run: |
          VER="$(grep -m1 '^version' native/chatyy-crypto/Cargo.toml | cut -d'"' -f2)-${CHATYY_CRYPTO_CORE}-${GITHUB_SHA::7}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          bash native/chatyy-crypto/ci/package.sh "$VER"
          D=native/chatyy-crypto/dist
          {
            echo "## chatyy-crypto ($CHATYY_CRYPTO_CORE) $VER"
            echo '```'
            cat $D/ios/size-report.txt 2>/dev/null || true
            for a in arm64-v8a armeabi-v7a x86_64; do echo "android $a: $(wc -c < $D/android/jniLibs/$a/libchatyy_crypto.so) B"; done
            cat $D/wasm/size-report.txt 2>/dev/null || true
            echo; cat $D/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chatyy-crypto-release
          path: native/chatyy-crypto/dist/release
          retention-days: 30
      - name: Release pré-compilado (release=true e core=real)
        if: ${{ inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$CHATYY_CRYPTO_CORE" = real ] || { echo "::error::release só com core=real"; exit 1; }
          TAG="chatyy-crypto-v${{ steps.pkg.outputs.ver }}"
          gh release create "$TAG" native/chatyy-crypto/dist/release/* --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Núcleo E2EE v5 pré-compilado (WP-02). Fixar em native/chatyy-crypto/ci/prebuilt.lock."
          echo "TAG=\"$TAG\"" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------
  # Legado E2EE v4 (native/e2ee), conteúdo sem mudança — só com v4=true.
  # ---------------------------------------------------------------------------------------
  v4-linux:
    if: ${{ inputs.v4 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../e2ee-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Rust toolchain + alvos Android + cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked

      - name: cargo test (nativo ↔ nativo + vetores do wasm)
        working-directory: native/e2ee/rust
        run: cargo test -p chatyy-e2ee-native

      - name: Vetores do nativo abrem no wasm do web
        run: |
          cd native/e2ee/rust && CHATYY_WRITE_VECTORS=1 cargo test -p chatyy-e2ee-native --test vectors native_to_wasm && cd -
          node native/e2ee/vectors/wasm-vectors.mjs check

      - name: Núcleo JS (services/e2eeV4Core.js) + adaptador nativo ↔ web
        run: node native/e2ee/js-test/core-interop.mjs

      - name: Android .so + bindings Kotlin
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          mkdir -p "$RUNNER_TEMP/e2ee-mod"
          cp -R native/e2ee/expo-chatyy-e2ee/. "$RUNNER_TEMP/e2ee-mod/"
          bash native/e2ee/rust/build-android.sh "$RUNNER_TEMP/e2ee-mod"

      - name: Bindings Kotlin na JVM (JNA) abrem vetor do wasm
        run: |
          cd "$RUNNER_TEMP"
          curl -sSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          curl -sSL -o jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar
          unzip -q kotlinc.zip
          ./kotlinc/bin/kotlinc -cp jna.jar \
            e2ee-mod/android/src/main/java/expo/modules/chatyye2ee/core/chatyy_e2ee.kt \
            "$GITHUB_WORKSPACE/native/e2ee/kotlin-smoke/Smoke.kt" -include-runtime -d smoke.jar
          java -Djna.library.path="$CARGO_TARGET_DIR/debug" -cp smoke.jar:jna.jar SmokeKt \
            "$GITHUB_WORKSPACE/native/e2ee/vectors/wasm-to-native.json"

      - uses: actions/upload-artifact@v4
        with:
          name: e2ee-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/e2ee-mod/android/src/main/jniLibs
            ${{ runner.temp }}/e2ee-mod/android/src/main/java/expo/modules/chatyye2ee/core
          retention-days: 14

  v4-ios:
    if: ${{ inputs.v4 == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../e2ee-target
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: xcframework + bindings Swift
        run: |
          mkdir -p "$RUNNER_TEMP/e2ee-mod"
          cp -R native/e2ee/expo-chatyy-e2ee/. "$RUNNER_TEMP/e2ee-mod/"
          bash native/e2ee/rust/build-ios.sh "$RUNNER_TEMP/e2ee-mod"
          ls -R "$RUNNER_TEMP/e2ee-mod/ios" | head -40

      - name: Smoke test Swift (bindings geradas + lib do host) abre vetor do wasm
        run: |
          GEN="$CARGO_TARGET_DIR/uniffi-swift"
          swiftc -O -module-name SmokeE2EE \
            -I "$GEN" -Xcc -fmodule-map-file="$GEN/ChatyyE2EECoreFFI.modulemap" \
            -L "$CARGO_TARGET_DIR/debug" -lchatyy_e2ee \
            "$GEN/ChatyyE2EECore.swift" native/e2ee/swift-smoke/main.swift -o "$RUNNER_TEMP/smoke"
          DYLD_LIBRARY_PATH="$CARGO_TARGET_DIR/debug" "$RUNNER_TEMP/smoke" native/e2ee/vectors/wasm-to-native.json

      - name: Compila o módulo Swift do Expo (sintaxe/tipos) contra o xcframework
        # Sem Pods: só confere que ChatyyE2EEModule.swift + bindings compilam
        # para iOS (ExpoModulesCore vem do node_modules num build real; aqui
        # basta o typecheck das bindings para arm64-apple-ios15.1).
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          XCF="$RUNNER_TEMP/e2ee-mod/ios/ChatyyE2EECore.xcframework/ios-arm64"
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.1 \
            -I "$XCF/Headers" -Xcc -fmodule-map-file="$XCF/Headers/module.modulemap" \
            "$RUNNER_TEMP/e2ee-mod/ios/Generated/ChatyyE2EECore.swift"

      - uses: actions/upload-artifact@v4
        with:
          name: e2ee-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/e2ee-mod/ios/ChatyyE2EECore.xcframework
            ${{ runner.temp }}/e2ee-mod/ios/Generated
          retention-days: 14
