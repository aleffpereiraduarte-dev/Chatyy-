name: iOS Sim Artifact → Prod Server

# Downloads an existing chatyy-ios-sim artifact from a previous successful
# build and SCPs it to the prod server for Mac Docker QA. Saves a 20min
# full rebuild when the .app is already built but a downstream step failed.

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Artifact ID to download (from previous ios-sim-build run)'
        required: true
        default: '6965412927'
  push:
    paths:
      - '.github/triggers/ios-sim-deploy.txt'

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifact via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ inputs.artifact_id || '6965412927' }}
        run: |
          set -e
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/artifact.zip
          ls -la /tmp/artifact.zip
          unzip -o /tmp/artifact.zip -d /tmp/artifact-extract
          ls -la /tmp/artifact-extract/
          # The artifact contains chatyy-sim.tar.gz inside
          TAR=$(find /tmp/artifact-extract -name "*.tar.gz" | head -1)
          if [ -z "$TAR" ]; then
            echo "::error::No .tar.gz inside artifact"
            ls -R /tmp/artifact-extract
            exit 1
          fi
          cp "$TAR" /tmp/chatyy-sim.tar.gz
          ls -la /tmp/chatyy-sim.tar.gz

      - name: Create release with .app tarball attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ios-sim-$(date +%Y%m%d-%H%M%S)"
          # Cria release pelo API (não precisa gh CLI)
          RELEASE_ID=$(curl -sX POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"iOS Sim Build $TAG\",\"body\":\"Chatyy.app pra Mac Docker QA. Sem signing (iphonesimulator).\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release ID: $RELEASE_ID"
          # Upload .tar.gz como asset
          curl -sX POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @/tmp/chatyy-sim.tar.gz \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=chatyy-sim.tar.gz"
          echo ""
          echo "Download URL: https://github.com/${{ github.repository }}/releases/download/$TAG/chatyy-sim.tar.gz"
