[package]
name = "chatyy-crypto"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
rust-version = "1.93"
description = "Chatyy E2EE v5 — núcleo único (Olm/Megolm via matrix-sdk-crypto =0.18.0 / vodozemac). Contrato: docs/e2ee/CONTRATO.md"

[lib]
name = "chatyy_crypto"
# staticlib → iOS xcframework (WP-02); cdylib → Android .so / wasm; lib → testes.
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["sqlite"]
# Store SQLite cifrado (iOS/Android/Linux). Obrigatório fora da web.
sqlite = ["dep:matrix-sdk-sqlite", "dep:rusqlite"]
# Anotações UniFFI (Swift/Kotlin) — WP-02 gera as bindings.
uniffi = ["dep:uniffi"]
# Web (wasm32 + IndexedDB) — WP-04 embrulha com wasm-bindgen.
# Só para os testes de integração (atalhos que pulam o QR). NUNCA em build de app.
testing = []
js = ["matrix-sdk-crypto/js", "dep:matrix-sdk-indexeddb", "getrandom/js", "dep:getrandom3"]

[dependencies]
# VERSÃO FIXA: o formato de store/pickle/fio depende dela (PLANO §2.1). Atualização trimestral c/ vetores.
matrix-sdk-crypto = { version = "=0.18.0", features = ["experimental-send-custom-to-device"] }
matrix-sdk-common = { version = "=0.18.0" }
matrix-sdk-sqlite = { version = "=0.18.0", default-features = false, features = ["crypto-store", "bundled"], optional = true }
rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }
matrix-sdk-indexeddb = { version = "=0.18.0", default-features = false, features = ["e2e-encryption"], optional = true }
vodozemac = { version = "=0.10.0", default-features = false, features = ["libolm-compat"] }
ruma = { version = "=0.16.0", features = ["client-api-c"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
zeroize = "1"
getrandom = "0.2"
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
uniffi = { version = "=0.29.5", optional = true, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"

[[test]]
name = "integration"
required-features = ["testing"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# NÃO "abort": com unwind, o catch_unwind do UniFFI vira exceção Swift/Kotlin em vez de matar o app/NSE.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[workspace]
