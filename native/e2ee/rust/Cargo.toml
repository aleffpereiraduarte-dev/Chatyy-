[package]
name = "chatyy-e2ee-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Chatyy E2EE v4 — vodozemac (Olm/Megolm) via UniFFI for iOS/Android. Same API as /root/chatyy-e2ee-wasm."

[lib]
name = "chatyy_e2ee"
# staticlib → iOS xcframework; cdylib → Android .so (JNA) + bindgen (library mode)
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# SAME version as the wasm wrapper — pickles and wire format must match bit for bit.
vodozemac = { version = "=0.11.1" }
uniffi = { version = "=0.29.5" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# NOT "abort": with unwind, UniFFI's catch_unwind turns an unexpected Rust
# panic into a Swift/Kotlin exception (InternalError) instead of killing the app.
panic = "unwind"

[workspace]
members = [".", "uniffi-bindgen"]
