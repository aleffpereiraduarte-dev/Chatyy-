# Tiny host-only binary: `cargo run -p uniffi-bindgen -- generate --library <lib> --language swift|kotlin`
[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { version = "=0.29.5", features = ["cli"] }
