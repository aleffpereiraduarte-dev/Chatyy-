[package]
name = "chatyy-crypto-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
rust-version = "1.93"
description = "WP-04: ponte wasm-bindgen do núcleo chatyy-crypto para o Web Worker (services/crypto/worker). Sem cripto própria."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Núcleo único (WP-01). Na web: feature `js` (IndexedDB + getrandom js), SEM sqlite.
chatyy-crypto = { path = "../../../native/chatyy-crypto", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
async-trait = "0.1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace]
