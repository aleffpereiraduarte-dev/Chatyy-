# Chatyy TCP/network optimization for high-throughput messaging
# Applied 2026-04-10

# TCP backlog for high-connection servers
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# TCP keepalive (detect dead connections faster)
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# TCP memory and buffer tuning
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Enable TCP Fast Open (reduce handshake latency)
net.ipv4.tcp_fastopen = 3

# Reuse TIME_WAIT sockets for new connections
net.ipv4.tcp_tw_reuse = 1

# Increase local port range for outbound connections
net.ipv4.ip_local_port_range = 1024 65535

# File descriptor limits
fs.file-max = 2097152
fs.nr_open = 2097152

# TCP congestion control: BBR (better than cubic for mobile/lossy networks)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Disable SYN cookies only if you have enough backlog (we do)
net.ipv4.tcp_syncookies = 1

# Enable window scaling
net.ipv4.tcp_window_scaling = 1
